# Regression case: CCC (Cho, Choi & Choi drift-resistive) inner layer on the rotated ray.
# A "computed" case (kind = "computed", no example_dir) that calls solve_inner with CCCModel on the
# physical q=4 benchmark surface with Q* = 0.5 (electron diamagnetic drift) and M⊥/M = 1.4
# (perpendicular transport) at Q = 5i, where the two exponential families of the far field separate,
# and tracks the interchange (Δ₊) / tearing (Δ₋) matching coefficients. Guards the CCC equations, its
# Wasow basis and splitting solve, and the centred contour angle against numerical drift across
# changes. Each [quantities.*] block names an HDF5 path in the computed output, how to extract it,
# and the noise floor for diffs.
[case]
name = "ccc_ray_q5i"
description = "CCC inner layer on the ray, q=4 surface, Q* = 0.5, M⊥/M = 1.4, Q = 5i"
kind = "computed"

# interchange (Δ₊) / tearing (Δ₋) from solve_inner(CCCModel(), CCCParameters(q4_surface_benchmark(), 0.5, 1.4), 5i·Q₀).
# Complex-valued; both real and imaginary parts are tracked separately. The components are O(20–2400);
# noise_threshold 1e-3 (absolute) sits above the ~1e-7 relative delta_convergence spread at this point
# and the cross-machine roundoff of the extended-precision march.
[quantities.delta_interchange_real]
h5path = "ccc/delta_interchange_real"
type = "real_scalar"
extract = "value"
label = "Re(Δ₊ interchange)"
noise_threshold = 1e-3
order = 10

[quantities.delta_interchange_imag]
h5path = "ccc/delta_interchange_imag"
type = "real_scalar"
extract = "value"
label = "Im(Δ₊ interchange)"
noise_threshold = 1e-3
order = 11

[quantities.delta_tearing_real]
h5path = "ccc/delta_tearing_real"
type = "real_scalar"
extract = "value"
label = "Re(Δ₋ tearing)"
noise_threshold = 1e-3
order = 12

[quantities.delta_tearing_imag]
h5path = "ccc/delta_tearing_imag"
type = "real_scalar"
extract = "value"
label = "Im(Δ₋ tearing)"
noise_threshold = 1e-3
order = 13

[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 90
