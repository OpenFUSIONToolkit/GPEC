# Regression case: DIII-D-like H-mode n=1 SLAYER tearing-mode growth rates.
# Uncoupled per-surface analysis with the AMR Q-plane scan; tracks the per-surface
# layer parameters and the extracted roots (Q, ω, γ) for the inner three rationals.
# Each [quantities.*] block names an HDF5 path in the run output, how to extract it,
# and the noise floor below which a difference is treated as zero.
[case]
name = "diiid_slayer_n1"
description = "DIII-D-like H-mode equilibrium, n=1, SLAYER tearing-mode analysis (uncoupled per-surface, AMR, validity-gated)"
example_dir = "examples/DIIID-like_SLAYER_example"

# Per-surface SLAYER layer parameters (geometry + dimensionless)
# Which formalism produced the Δ′ this case's layer physics consumes. The Δ′ matrix lands on
# one canonical SingularSurfaces/ path whichever integrator computed it, so pinning the deck's
# declared choice is what keeps a BVP-derived gold from being compared against a Galerkin run.
[quantities.integrator]
h5path = "Input/gpec_toml_raw"
type = "token"
extract = "toml_key:ForceFreeStates.integrator"
label = "integrator (Δ′ provenance)"
noise_threshold = 0
order = 1

[quantities.slayer_ising]
h5path = "Tearing/PerSurface/rational_index"
type = "real_vector"
extract = "all_real"
label = "SLAYER surface indices"
noise_threshold = 0
order = 10

[quantities.slayer_m]
h5path = "Tearing/PerSurface/m"
type = "real_vector"
extract = "all_real"
label = "SLAYER poloidal m"
noise_threshold = 0
order = 11

[quantities.slayer_n]
h5path = "Tearing/PerSurface/n"
type = "real_vector"
extract = "all_real"
label = "SLAYER toroidal n"
noise_threshold = 0
order = 12

[quantities.slayer_rs]
h5path = "Tearing/PerSurface/rs"
type = "real_vector"
extract = "all_real"
label = "SLAYER minor radius rs"
noise_threshold = 1e-10
order = 13

[quantities.slayer_sval_r]
h5path = "Tearing/PerSurface/sval_r"
type = "real_vector"
extract = "all_real"
label = "SLAYER r-based shear"
noise_threshold = 1e-10
order = 14

[quantities.slayer_lu]
h5path = "Tearing/PerSurface/lu"
type = "real_vector"
extract = "all_real"
label = "SLAYER Lundquist S"
noise_threshold = 1e-8
order = 15

[quantities.slayer_D_norm]
h5path = "Tearing/PerSurface/D_norm"
type = "real_vector"
extract = "all_real"
label = "SLAYER D_norm"
noise_threshold = 1e-10
order = 16

[quantities.slayer_P_perp]
h5path = "Tearing/PerSurface/P_perp"
type = "real_vector"
extract = "all_real"
label = "SLAYER P_perp"
noise_threshold = 1e-8
order = 17

[quantities.slayer_tauk]
h5path = "Tearing/PerSurface/tau_k"
type = "real_vector"
extract = "all_real"
label = "SLAYER tauk"
noise_threshold = 1e-12
order = 18

[quantities.slayer_iota_e]
h5path = "Tearing/PerSurface/iota_e"
type = "real_vector"
extract = "all_real"
label = "SLAYER iota_e"
noise_threshold = 1e-12
order = 19

# Tearing eigenvalue (coupled mode → length 1). The headline deliverable:
# a real, nonzero growth rate on a realistic equilibrium. Root-extraction
# is sensitive to the AMR cell topology and ODE solver, so the Q/ω/γ
# thresholds are absolute and modestly loose; re-pin intentionally if a
# solver/AMR change shifts the root inventory.
# Growth-rate / frequency / root outputs. Pinned for the inner three rational
# surfaces only (2/1, 3/1, 4/1) via `first_3`: the Δ'/γ contour search is
# numerically unreliable on the outermost surfaces (e.g. 5/1, 6/1, 7/1 near the
# edge), so those are deliberately not golden-tracked.
[quantities.slayer_Q]
h5path = "Tearing/Roots/Q_root"
type = "complex_vector"
extract = "first_3_complex"
label = "SLAYER Q_root [2/1,3/1,4/1]"
noise_threshold = 1e-4
order = 30

[quantities.slayer_omega_Hz]
h5path = "Tearing/Roots/omega"
type = "real_vector"
extract = "first_3"
label = "SLAYER ω_Hz [2/1,3/1,4/1]"
noise_threshold = 1.0
order = 32

[quantities.slayer_gamma_Hz]
h5path = "Tearing/Roots/gamma"
type = "real_vector"
extract = "first_3"
label = "SLAYER γ_Hz [2/1,3/1,4/1]"
noise_threshold = 1e-1
order = 33

# no_root flag (1 = extraction failed). Pinned for the inner three surfaces;
# this case guards that the 2/1, 3/1, 4/1 keep finding a real root.
[quantities.slayer_no_root]
h5path = "Tearing/Roots/no_root"
type = "real_vector"
extract = "first_3"
label = "SLAYER no_root flags [2/1,3/1,4/1]"
noise_threshold = 0
order = 34

# Outer-region Δ' consumed by the SLAYER matching — the same STRIDE-like BVP (PEST3) matrix
# the riccati case pins at source; tracked here too so a change in what SLAYER actually
# ingests is caught even if the source case is not run.
[quantities.slayer_delta_prime_diag]
h5path = "Tearing/PerSurface/Delta_prime_matrix"
type = "complex_matrix"
extract = "diagonal_complex"
label = "Δ′ STRIDE-like BVP (PEST3) diagonal, as ingested by SLAYER"
noise_threshold = 1e-8
order = 40

# Inner-layer solve outputs per surface (the resistive-layer Riccati solution itself, not the
# outer matching). The adaptive-scan Δ(Q) sample arrays are deliberately NOT pinned: AMR sample
# locations move under any refinement change, so they have no stable identity to pin.
[quantities.slayer_delta_s]
h5path = "Tearing/LayerWidths/delta_s"
type = "complex_vector"
extract = "all_complex"
label = "SLAYER inner-layer thickness δ_s (complex, Riccati)"
noise_threshold = 1e-10
order = 41

[quantities.slayer_delta_s_over_d_beta]
h5path = "Tearing/LayerWidths/delta_s_over_d_beta"
type = "complex_vector"
extract = "all_complex"
label = "SLAYER inner-layer δ_s/d_β (complex, dimensionless)"
noise_threshold = 1e-10
order = 42

[quantities.slayer_delta_s_abs]
h5path = "Tearing/LayerWidths/delta_s_abs"
type = "real_vector"
extract = "all_real"
label = "SLAYER inner-layer physical thickness |δ_s| [m]"
noise_threshold = 1e-12
order = 43

[quantities.slayer_d_beta]
h5path = "Tearing/LayerWidths/d_beta"
type = "real_vector"
extract = "all_real"
label = "SLAYER β-weighted ion drift scale d_β [m]"
noise_threshold = 1e-12
order = 44

# Settings (catches accidental config drift)
[quantities.slayer_enabled]
h5path = "Tearing/enabled"
type = "int_scalar"
extract = "value"
label = "SLAYER enabled flag"
noise_threshold = 0
order = 90

[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
