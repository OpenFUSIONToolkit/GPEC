[case]
name = "diiid_slayer_n1"
description = "DIII-D-like H-mode equilibrium, n=1, SLAYER tearing-mode analysis (uncoupled per-surface, AMR, validity-gated)"
example_dir = "examples/DIIID-like_SLAYER_example"

# ---------------------------------------------------------------------
# Per-surface SLAYER layer parameters (geometry + dimensionless)
# ---------------------------------------------------------------------
[quantities.slayer_ising]
h5path = "slayer/per_surface/ising"
type = "real_vector"
extract = "all_real"
label = "SLAYER surface indices"
noise_threshold = 0
order = 10

[quantities.slayer_m]
h5path = "slayer/per_surface/m"
type = "real_vector"
extract = "all_real"
label = "SLAYER poloidal m"
noise_threshold = 0
order = 11

[quantities.slayer_n]
h5path = "slayer/per_surface/n"
type = "real_vector"
extract = "all_real"
label = "SLAYER toroidal n"
noise_threshold = 0
order = 12

[quantities.slayer_rs]
h5path = "slayer/per_surface/rs"
type = "real_vector"
extract = "all_real"
label = "SLAYER minor radius rs"
noise_threshold = 1e-10
order = 13

[quantities.slayer_sval_r]
h5path = "slayer/per_surface/sval_r"
type = "real_vector"
extract = "all_real"
label = "SLAYER r-based shear"
noise_threshold = 1e-10
order = 14

[quantities.slayer_lu]
h5path = "slayer/per_surface/lu"
type = "real_vector"
extract = "all_real"
label = "SLAYER Lundquist S"
noise_threshold = 1e-8
order = 15

[quantities.slayer_D_norm]
h5path = "slayer/per_surface/D_norm"
type = "real_vector"
extract = "all_real"
label = "SLAYER D_norm"
noise_threshold = 1e-10
order = 16

[quantities.slayer_P_perp]
h5path = "slayer/per_surface/P_perp"
type = "real_vector"
extract = "all_real"
label = "SLAYER P_perp"
noise_threshold = 1e-8
order = 17

[quantities.slayer_tauk]
h5path = "slayer/per_surface/tauk"
type = "real_vector"
extract = "all_real"
label = "SLAYER tauk"
noise_threshold = 1e-12
order = 18

[quantities.slayer_iota_e]
h5path = "slayer/per_surface/iota_e"
type = "real_vector"
extract = "all_real"
label = "SLAYER iota_e"
noise_threshold = 1e-12
order = 19

# ---------------------------------------------------------------------
# Tearing eigenvalue (coupled mode → length 1). The headline deliverable:
# a real, nonzero growth rate on a realistic equilibrium. Root-extraction
# is sensitive to the AMR cell topology and ODE solver, so the Q/ω/γ
# thresholds are absolute and modestly loose; re-pin intentionally if a
# solver/AMR change shifts the root inventory.
# Growth-rate / frequency / root outputs. Pinned for the inner three rational
# surfaces only (2/1, 3/1, 4/1) via `first_3`: the Δ'/γ contour search is
# numerically unreliable on the outermost surfaces (e.g. 5/1, 6/1, 7/1 near the
# edge), so those are deliberately not golden-tracked.
# ---------------------------------------------------------------------
[quantities.slayer_Q_re]
h5path = "slayer/roots/Q_root_real"
type = "real_vector"
extract = "first_3"
label = "SLAYER Re(Q_root) [2/1,3/1,4/1]"
noise_threshold = 1e-4
order = 30

[quantities.slayer_Q_im]
h5path = "slayer/roots/Q_root_imag"
type = "real_vector"
extract = "first_3"
label = "SLAYER Im(Q_root) [2/1,3/1,4/1]"
noise_threshold = 1e-4
order = 31

[quantities.slayer_omega_Hz]
h5path = "slayer/roots/omega_Hz"
type = "real_vector"
extract = "first_3"
label = "SLAYER ω_Hz [2/1,3/1,4/1]"
noise_threshold = 1.0
order = 32

[quantities.slayer_gamma_Hz]
h5path = "slayer/roots/gamma_Hz"
type = "real_vector"
extract = "first_3"
label = "SLAYER γ_Hz [2/1,3/1,4/1]"
noise_threshold = 1e-1
order = 33

# no_root flag (1 = extraction failed). Pinned for the inner three surfaces;
# this case guards that the 2/1, 3/1, 4/1 keep finding a real root.
[quantities.slayer_no_root]
h5path = "slayer/roots/no_root"
type = "real_vector"
extract = "first_3"
label = "SLAYER no_root flags [2/1,3/1,4/1]"
noise_threshold = 0
order = 34

# ---------------------------------------------------------------------
# Settings (catches accidental config drift)
# ---------------------------------------------------------------------
[quantities.slayer_enabled]
h5path = "slayer/enabled"
type = "int_scalar"
extract = "value"
label = "SLAYER enabled flag"
noise_threshold = 0
order = 90

# ---------------------------------------------------------------------
# Runtime
# ---------------------------------------------------------------------
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
