# Regression case: Solovev n=1 ideal stability + perturbed equilibrium + post-PE NTV torque.
# The only case exercising the KineticForces outer ψ torque quadrature (fgar method):
# rational-surface paneling, maxevals_psi cap, and the atol_psi/rtol_psi defaults.
# Each [quantities.*] block names an HDF5 path in the run output, how to extract it, and the
# noise floor below which a difference is treated as zero.
[case]
name = "solovev_kinetic_ntv"
description = "Solovev analytical equilibrium, n=1, ideal + PE + NTV torque quadrature"
example_dir = "examples/Solovev_kinetic_NTV_example"

# NTV torque — the primary tracked quantity of this case. [Re, Im] pair; the ψ quadrature
# converges to rtol_psi=1e-2, but the result is deterministic for fixed code + inputs, so
# the noise floor is set near FP noise and any real movement is surfaced.
[quantities.ntv_torque]
h5path = "KineticForces/fgar/total_torque"
type = "real_vector"
extract = "all_real"
label = "NTV torque fgar [Re, Im]"
noise_threshold = 1e-8
order = 10

[quantities.ntv_psi_nsteps]
h5path = "KineticForces/fgar/psi_nsteps"
type = "int_scalar"
extract = "value"
label = "NTV ψ quadrature evaluations"
noise_threshold = 0
order = 11

# Fluid CGL limit on the same ψ quadrature (fcgl method, l = 0 only): tracks the surface drive
# convention κ·ξ⊥ = -(δB/B + ∇·ξ⊥) independently of the kinetic resonance operator.
[quantities.fcgl_energy]
h5path = "KineticForces/fcgl/total_energy"
type = "real_scalar"
extract = "value"
label = "fluid CGL energy fcgl [J]"
noise_threshold = 1e-8
order = 12

# Stability anchors — confirm the upstream FFS/PE stages feeding the NTV diagnostic.
[quantities.et_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "root-area-weighted total energy Re(et[1])"
noise_threshold = 1e-10
order = 20

[quantities.msing]
h5path = "SingularSurfaces/rational_count"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0
order = 21

[quantities.sing_psi]
h5path = "SingularSurfaces/rational_psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8
order = 22

[quantities.q0]
h5path = "Equilibrium/q_axis"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 0
order = 23

# Runtime (special: not from H5)
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
