# Regression case: separatrix-finder robustness for fixed-boundary EFITs (PR #296, closes #294).
# A "computed" case (kind = "computed", no example_dir) that loads a fixed-boundary TokaMaker
# aspect-scan g-file whose computational box hugs the LCFS (circular R/a=20, eps=0.05). Outside
# the prescribed LCFS the coil-vacuum flux turns back above the boundary value before the grid
# edge, so the old bracketed Roots.Brent() separatrix finder could not bracket the psi=sibry
# crossing and direct_position! threw "not a bracketing interval". The Newton finder (faithful to
# Fortran direct.f) locates the innermost LCFS crossing regardless. This case errored on the buggy
# code and now loads; it tracks the leading equilibrium scalars so the loading path stays stable.
# Fixture g-file: examples/efit_fixedbdy_separatrix_example/eq_eps0.0500000_k1.000_d0.000.geqdsk
[case]
name = "efit_fixedbdy_separatrix"
description = "Fixed-boundary EFIT (box hugs LCFS), Newton separatrix-find regression"
kind = "computed"

[quantities.psio]
h5path = "equil/psio"
type = "real_scalar"
extract = "value"
label = "psio (total poloidal flux)"
noise_threshold = 1e-12
order = 10

[quantities.q0]
h5path = "equil/q0"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-12
order = 11

[quantities.q95]
h5path = "equil/q95"
type = "real_scalar"
extract = "value"
label = "q95"
noise_threshold = 1e-12
order = 12

[quantities.betat]
h5path = "equil/betat"
type = "real_scalar"
extract = "value"
label = "beta_t"
noise_threshold = 1e-12
order = 13

[quantities.betan]
h5path = "equil/betan"
type = "real_scalar"
extract = "value"
label = "beta_n"
noise_threshold = 1e-12
order = 14

[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 90
