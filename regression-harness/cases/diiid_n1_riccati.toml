# Regression case: DIII-D-like n=1 Δ' matrix from the Riccati chunked propagator BVP, and the Riccati
# plasma response to the C-coil. The canonical Δ' track (its sibling diiid_n1 runs the forward integrator),
# with the resonant coupling from both the finite-width jump and the asymptotic small solution. Also tracks the
# free-boundary energies and singular-surface locations the BVP depends on, so a Δ' move can be attributed.
# Each [quantities.*] block names an HDF5 path in the run output, how to extract it, and the
# noise floor below which a difference is treated as zero.
[case]
name = "diiid_n1_riccati"
description = "DIII-D-like equilibrium, n=1, Riccati integrator Δ' matrix"
example_dir = "examples/DIIID-like_riccati_deltaprime_example"

# Tearing stability Δ' — the msing×msing BVP matrix diagonal, and the raw side-major
# outer-region matrix it is projected from.
[quantities.delta_prime]
h5path = "SingularSurfaces/Delta_prime_matrix"
type = "complex_matrix"
extract = "diagonal_complex"
label = "delta prime (BVP diagonal)"
noise_threshold = 1e-8
order = 10

[quantities.delta_prime_raw]
h5path = "SingularSurfaces/Delta_prime_raw_freeboundary"
type = "complex_matrix"
extract = "all_complex"
label = "delta prime (raw side-major)"
noise_threshold = 1e-8
order = 11

# Fixed-boundary (conformal wall on the plasma) PEST-3 Δ′ diagonal
[quantities.delta_prime_fixedboundary_diag]
h5path = "SingularSurfaces/Delta_prime_matrix_fixedboundary"
type = "complex_matrix"
extract = "diagonal_complex"
label = "delta prime fixed boundary (BVP diagonal)"
noise_threshold = 1e-8
order = 13

[quantities.delta_ef]
h5path = "SingularSurfaces/Delta_EF"
type = "complex_matrix"
extract = "all_complex"
label = "edge coil response delta_ef"
noise_threshold = 1e-8
order = 12

# Energies — leading generalized (W,N) pencil eigenvalues at the final truncation (psilim): power-normalized (⟨|ξ|²⟩ = 1 metric) and invariant to the working-coordinate Jacobian.
[quantities.et_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "total energy Re(et[1])"
noise_threshold = 1e-7
order = 20

[quantities.ep_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "real_first"
label = "plasma energy Re(ep[1])"
noise_threshold = 1e-7
order = 21

[quantities.ev_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "real_first"
label = "vacuum energy Re(ev[1])"
noise_threshold = 1e-7
order = 22

[quantities.et_all]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "all_complex"
label = "total energy (all)"
noise_threshold = 1e-4
order = 23

# Singular surfaces — the Δ' matrix is indexed by these, so a shift here explains a Δ' shift.
[quantities.msing]
h5path = "SingularSurfaces/rational_count"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0
order = 30

[quantities.sing_psi]
h5path = "SingularSurfaces/rational_psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8
order = 31

[quantities.sing_q]
h5path = "SingularSurfaces/rational_q"
type = "real_vector"
extract = "all_real"
label = "singular q values"
noise_threshold = 1e-8
order = 32

# Integration — stored and total solver-step counts move when the chunk layout or the tolerance changes.
[quantities.nstep]
h5path = "ForceFreeStates/Solutions/ForwardIntegration/nstep"
type = "int_scalar"
extract = "value"
label = "ODE steps (saved)"
noise_threshold = 5
order = 40

[quantities.nstep_total]
h5path = "ForceFreeStates/Solutions/ForwardIntegration/nstep_total"
type = "int_scalar"
extract = "value"
label = "ODE steps (total)"
noise_threshold = 10
order = 41

# Mode numbers
[quantities.mpert]
h5path = "Info/mpert"
type = "int_scalar"
extract = "value"
label = "mpert"
noise_threshold = 0
order = 50

[quantities.npert]
h5path = "Info/npert"
type = "int_scalar"
extract = "value"
label = "npert"
noise_threshold = 0
order = 51

# Equilibrium — shared with diiid_n1; confirms the two cases sit on the same equilibrium.
[quantities.q0]
h5path = "Equilibrium/q_axis"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-12
order = 60

[quantities.q95]
h5path = "Equilibrium/q_95"
type = "real_scalar"
extract = "value"
label = "q95"
noise_threshold = 1e-12
order = 61

[quantities.betan]
h5path = "Equilibrium/beta_N"
type = "real_scalar"
extract = "value"
label = "beta_n"
noise_threshold = 1e-12
order = 62

# Plasma response to the C-coil: the resonant coupling from the finite-width ∂b^ψ/∂ψ jump and, through Delta_EF,
# from the asymptotic small solution (_asymptotic); the solver's own exponent α at each surface.
[quantities.alpha]
h5path = "SingularSurfaces/alpha"
type = "complex_vector"
extract = "all_complex"
label = "solver exponent alpha per surface"
noise_threshold = 1e-10
order = 70

[quantities.permeability_diag]
h5path = "PerturbedEquilibrium/ResponseMatrices/permeability"
type = "complex_matrix"
extract = "diagonal_complex"
label = "permeability diagonal"
noise_threshold = 1e-8
order = 71

[quantities.delta_mn_all]
h5path = "PerturbedEquilibrium/SingularCoupling/Delta_mn"
type = "complex_vector"
extract = "all_complex"
label = "forcing-driven Delta_mn per row"
noise_threshold = 1e-8
order = 72

[quantities.delta_mn_asymptotic_all]
h5path = "PerturbedEquilibrium/SingularCoupling/Delta_mn_asymptotic"
type = "complex_vector"
extract = "all_complex"
label = "forcing-driven asymptotic Delta_mn per row"
noise_threshold = 1e-8
order = 73

[quantities.resonant_field_all]
h5path = "PerturbedEquilibrium/SingularCoupling/resonant_area_weighted_field"
type = "complex_vector"
extract = "all_complex"
label = "resonant field per row"
noise_threshold = 1e-8
order = 74

[quantities.resonant_field_asymptotic_all]
h5path = "PerturbedEquilibrium/SingularCoupling/resonant_area_weighted_field_asymptotic"
type = "complex_vector"
extract = "all_complex"
label = "asymptotic resonant field per row"
noise_threshold = 1e-8
order = 75

[quantities.island_half_width_asymptotic]
h5path = "PerturbedEquilibrium/SingularCoupling/island_half_width_asymptotic"
type = "real_vector"
extract = "all_real"
label = "asymptotic island half-width per row"
noise_threshold = 1e-8
order = 76

[quantities.c_delta_mn_asymptotic_norm]
h5path = "PerturbedEquilibrium/SingularCoupling/C_Delta_mn_asymptotic"
type = "complex_matrix"
extract = "norm"
label = "||C_Delta_mn_asymptotic||"
noise_threshold = 1e-8
order = 77

# Runtime
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
