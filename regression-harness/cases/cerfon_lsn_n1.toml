# Regression case: Cerfon-Freidberg diverted analytic equilibrium, n=1 ideal stability.
# Lower single null with the magnetic null on the plasma boundary, so q is unbounded as
# psi_N -> 1 and the run is truncated by psihigh rather than by a finite edge q. That makes
# this the fixture that notices changes in edge/truncation handling: anything touching the
# radial grid near psihigh, the flux-surface tracer, or the singular-surface search moves
# q at the truncation surface and the outermost rational here long before it shows up in the
# limited fixtures. The deck sits at a wall-stabilized operating point (n=1 stable with the
# conformal wall, unstable without), so a sign change in the energies is a real signal, not
# a marginal case wobbling about zero.
[case]
name = "cerfon_lsn_n1"
description = "Cerfon-Freidberg diverted (LSN) equilibrium, n=1, ideal stability"
example_dir = "examples/Cerfon_diverted_example"

# Energies — leading generalized (W,N) pencil eigenvalues at the final truncation (psilim): power-normalized (⟨|ξ|²⟩ = 1 metric) and invariant to the working-coordinate Jacobian.
[quantities.et_real]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "total energy Re(et[1])"
noise_threshold = 1e-10
order = 10
class = "physics_converged"

[quantities.et_imag]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "imag_first"
label = "total energy Im(et[1])"
noise_threshold = 1e-10
order = 11
class = "physics_converged"

[quantities.ep_real]
h5path = "FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "real_first"
label = "plasma energy Re(ep[1])"
noise_threshold = 1e-10
order = 12
class = "physics_converged"

[quantities.ev_real]
h5path = "FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "real_first"
label = "vacuum energy Re(ev[1])"
noise_threshold = 1e-10
order = 13
class = "physics_converged"

[quantities.vacuum_eigenvalue]
h5path = "FreeBoundaryStability/vacuum_eigenvalue"
type = "real_scalar"
extract = "value"
label = "vacuum matrix min eigenvalue"
noise_threshold = 1e-10
order = 14
class = "physics_converged"

[quantities.et_all]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "all_complex"
label = "total energy (all)"
noise_threshold = 1e-10
order = 20
class = "physics_converged"

# Integration
[quantities.nstep]
h5path = "integration/nstep"
type = "int_scalar"
extract = "value"
label = "ODE steps (saved)"
noise_threshold = 0
order = 30
class = "diagnostic"

[quantities.nstep_total]
h5path = "integration/nstep_total"
type = "int_scalar"
extract = "value"
label = "ODE steps (total)"
noise_threshold = 0
order = 31
class = "diagnostic"

# Equilibrium — q95 and q0 pin the flux scale, which is solved from the requested on-axis q.
[quantities.q0]
h5path = "equil/q0"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-12
order = 40
class = "equilibrium_scalar"

[quantities.q95]
h5path = "equil/q95"
type = "real_scalar"
extract = "value"
label = "q95"
noise_threshold = 1e-12
order = 41
class = "equilibrium_scalar"

[quantities.betat]
h5path = "equil/betat"
type = "real_scalar"
extract = "value"
label = "beta_t"
noise_threshold = 1e-12
order = 42
class = "equilibrium_scalar"

[quantities.betan]
h5path = "equil/betan"
type = "real_scalar"
extract = "value"
label = "beta_n"
noise_threshold = 1e-12
order = 43
class = "equilibrium_scalar"

# Singular surfaces — the outermost rational is set by where psihigh cuts the diverging q,
# so these are the quantities that expose a change in truncation behaviour.
[quantities.msing]
h5path = "singular/msing"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0
order = 50
class = "topological"

[quantities.sing_psi]
h5path = "singular/psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8
order = 51
class = "physics_converged"

[quantities.sing_q]
h5path = "singular/q"
type = "real_vector"
extract = "all_real"
label = "singular q values"
noise_threshold = 1e-8
order = 52
class = "physics_converged"

# Mode numbers
[quantities.mpert]
h5path = "info/mpert"
type = "int_scalar"
extract = "value"
label = "mpert"
noise_threshold = 0
order = 60
class = "topological"

[quantities.npert]
h5path = "info/npert"
type = "int_scalar"
extract = "value"
label = "npert"
noise_threshold = 0
order = 61
class = "topological"

# Profiles (checksums for fast comparison of large arrays)
[quantities.q_profile]
h5path = "splines/profiles/q"
type = "real_vector"
extract = "checksum"
label = "q profile (checksum)"
noise_threshold = 0
order = 70
class = "physics_converged"

[quantities.pressure_profile]
h5path = "splines/profiles/mu0p"
type = "real_vector"
extract = "checksum"
label = "pressure profile (checksum)"
noise_threshold = 0
order = 71
class = "physics_converged"

# Runtime (special: not from H5)
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
class = "diagnostic"
