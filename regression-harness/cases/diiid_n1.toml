# Regression case: DIII-D-like n=1 ideal stability + perturbed equilibrium.
# Tracks energies, singular-surface metrics, and resonant-flux diagnostics for the canonical
# DIIID-like fixture, which runs the forward integrator for its dense ξ profiles. The BVP Δ'
# matrix comes from the Riccati integrator only and is tracked by the sibling case
# diiid_n1_riccati. Each [quantities.*] block names an HDF5 path in the run output, how to
# extract it, and the noise floor below which a difference is treated as zero. Run via the
# regression-harness (see CLAUDE.md).
[case]
name = "diiid_n1"
description = "DIII-D-like equilibrium, n=1, ideal + perturbed equilibrium"
example_dir = "examples/DIIID-like_ideal_example"

# Energies — leading generalized (W,N) pencil eigenvalues at the final truncation (psilim): power-normalized (⟨|ξ|²⟩ = 1 metric) and invariant to the working-coordinate Jacobian.
[quantities.et_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "total energy Re(et[1])"
noise_threshold = 1e-10
order = 10
class = "physics_converged"

[quantities.et_imag]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "imag_first"
label = "total energy Im(et[1])"
noise_threshold = 1e-10
order = 11
class = "physics_converged"

[quantities.ep_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "real_first"
label = "plasma energy Re(ep[1])"
noise_threshold = 1e-10
order = 12
class = "physics_converged"

[quantities.ev_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "real_first"
label = "vacuum energy Re(ev[1])"
noise_threshold = 1e-10
order = 13
class = "physics_converged"

[quantities.vacuum_eigenvalue]
h5path = "ForceFreeStates/FreeBoundaryStability/vacuum_eigenvalue"
type = "real_scalar"
extract = "value"
label = "vacuum matrix min eigenvalue"
noise_threshold = 1e-10
order = 14
class = "physics_converged"

# Energies — full eigenvalue arrays
[quantities.ep_all]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "all_complex"
label = "plasma energy (all)"
noise_threshold = 1e-10
order = 20
class = "physics_converged"

[quantities.ev_all]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "all_complex"
label = "vacuum energy (all)"
noise_threshold = 1e-10
order = 21
class = "physics_converged"

[quantities.et_all]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "all_complex"
label = "total energy (all)"
noise_threshold = 1e-10
order = 22
class = "physics_converged"

# Integration
[quantities.nstep]
h5path = "ForceFreeStates/Solutions/ForwardIntegration/nstep"
type = "int_scalar"
extract = "value"
label = "ODE steps (saved)"
noise_threshold = 0
order = 30
class = "diagnostic"

[quantities.nstep_total]
h5path = "ForceFreeStates/Solutions/ForwardIntegration/nstep_total"
type = "int_scalar"
extract = "value"
label = "ODE steps (total)"
noise_threshold = 0
order = 31
class = "diagnostic"

# Equilibrium
[quantities.q0]
h5path = "Equilibrium/q_axis"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-12
order = 40
class = "equilibrium_scalar"

[quantities.q95]
h5path = "Equilibrium/q_95"
type = "real_scalar"
extract = "value"
label = "q95"
noise_threshold = 1e-12
order = 41
class = "equilibrium_scalar"

[quantities.betat]
h5path = "Equilibrium/beta_t"
type = "real_scalar"
extract = "value"
label = "beta_t"
noise_threshold = 1e-12
order = 42
class = "equilibrium_scalar"

[quantities.betan]
h5path = "Equilibrium/beta_N"
type = "real_scalar"
extract = "value"
label = "beta_n"
noise_threshold = 1e-12
order = 43
class = "equilibrium_scalar"

[quantities.li1]
h5path = "Equilibrium/l_i_1"
type = "real_scalar"
extract = "value"
label = "internal inductance li1"
noise_threshold = 1e-12
order = 44
class = "equilibrium_scalar"

[quantities.li2]
h5path = "Equilibrium/l_i_2"
type = "real_scalar"
extract = "value"
label = "internal inductance li2"
noise_threshold = 1e-12
order = 45
class = "equilibrium_scalar"

[quantities.li3]
h5path = "Equilibrium/l_i_3"
type = "real_scalar"
extract = "value"
label = "internal inductance li3"
noise_threshold = 1e-12
order = 46
class = "equilibrium_scalar"

[quantities.betap1]
h5path = "Equilibrium/beta_p_1"
type = "real_scalar"
extract = "value"
label = "poloidal beta betap1"
noise_threshold = 1e-12
order = 47
class = "equilibrium_scalar"

[quantities.betap2]
h5path = "Equilibrium/beta_p_2"
type = "real_scalar"
extract = "value"
label = "poloidal beta betap2"
noise_threshold = 1e-12
order = 48
class = "equilibrium_scalar"

[quantities.betap3]
h5path = "Equilibrium/beta_p_3"
type = "real_scalar"
extract = "value"
label = "poloidal beta betap3"
noise_threshold = 1e-12
order = 49
class = "equilibrium_scalar"

[quantities.betaj]
h5path = "Equilibrium/beta_j"
type = "real_scalar"
extract = "value"
label = "current beta betaj"
noise_threshold = 1e-12
order = 57
class = "equilibrium_scalar"

[quantities.volume]
h5path = "Equilibrium/volume"
type = "real_scalar"
extract = "value"
label = "plasma volume"
noise_threshold = 1e-12
order = 58
class = "equilibrium_scalar"

[quantities.crnt]
h5path = "Equilibrium/I_p"
type = "real_scalar"
extract = "value"
label = "plasma current"
noise_threshold = 1e-12
order = 59
class = "equilibrium_scalar"

[quantities.bt0]
h5path = "Equilibrium/B_T_axis"
type = "real_scalar"
extract = "value"
label = "toroidal field bt0"
noise_threshold = 1e-12
order = 62
class = "equilibrium_scalar"

[quantities.bwall]
h5path = "Equilibrium/B_T_wall"
type = "real_scalar"
extract = "value"
label = "wall field bwall"
noise_threshold = 1e-12
order = 63
class = "equilibrium_scalar"

[quantities.aratio]
h5path = "Equilibrium/aspect_ratio"
type = "real_scalar"
extract = "value"
label = "aspect ratio"
noise_threshold = 1e-12
order = 64
class = "equilibrium_scalar"

[quantities.kappa]
h5path = "Equilibrium/kappa"
type = "real_scalar"
extract = "value"
label = "elongation kappa"
noise_threshold = 1e-12
order = 65
class = "equilibrium_scalar"

# Singular surfaces
[quantities.msing]
h5path = "SingularSurfaces/rational_count"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0
order = 50
class = "topological"

[quantities.sing_psi]
h5path = "SingularSurfaces/rational_psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8
order = 51
class = "physics_converged"

[quantities.sing_q]
h5path = "SingularSurfaces/rational_q"
type = "real_vector"
extract = "all_real"
label = "singular q values"
noise_threshold = 1e-8
order = 52
class = "physics_converged"

# Mode numbers
[quantities.mpert]
h5path = "Info/mpert"
type = "int_scalar"
extract = "value"
label = "mpert"
noise_threshold = 0
order = 60
class = "topological"

[quantities.npert]
h5path = "Info/npert"
type = "int_scalar"
extract = "value"
label = "npert"
noise_threshold = 0
order = 61
class = "topological"

[quantities.island_half_width]
h5path = "PerturbedEquilibrium/SingularCoupling/island_half_width"
type = "real_vector"
extract = "all_real"
label = "island half-widths"
noise_threshold = 1e-8
order = 81
class = "physics_converged"

[quantities.chirikov_parameter]
h5path = "PerturbedEquilibrium/SingularCoupling/chirikov_parameter"
type = "real_vector"
extract = "all_real"
label = "Chirikov parameter"
noise_threshold = 1e-8
order = 82
class = "physics_converged"

[quantities.resonant_area_weighted_field]
h5path = "PerturbedEquilibrium/SingularCoupling/resonant_area_weighted_field"
type = "complex_vector"
extract = "norm"
label = "||resonant area-weighted field||"
noise_threshold = 1e-8
order = 83
class = "physics_converged"

[quantities.resonant_area_weighted_field_all]
h5path = "PerturbedEquilibrium/SingularCoupling/resonant_area_weighted_field"
type = "complex_vector"
extract = "all_complex"
label = "resonant area-weighted field b^r"
noise_threshold = 1e-8
class = "physics_converged"

# Dominant resonant-coupling mode: singular values of the b̃-space coupling matrix over every
# rational surface (coordinate-invariant), and the applied forcing's magnitude on the dominant
# mode. Singular vectors carry an arbitrary phase, so only the magnitude is tracked.
[quantities.dominant_singular_values]
h5path = "PerturbedEquilibrium/SingularCoupling/DominantMode/singular_values"
type = "real_vector"
extract = "all_real"
label = "dominant-coupling singular values"
noise_threshold = 1e-8
order = 84

[quantities.dominant_forcing_overlap]
h5path = "PerturbedEquilibrium/SingularCoupling/DominantMode/forcing_overlap"
type = "complex_vector"
extract = "abs_first"
label = "|forcing overlap with dominant mode|"
noise_threshold = 1e-8
order = 85

# Perturbed equilibrium: energies
[quantities.pe_plasma_energy]
h5path = "PerturbedEquilibrium/Energies/plasma_energy"
type = "real_scalar"
extract = "value"
label = "PE plasma energy"
noise_threshold = 1e-10
order = 91
class = "physics_converged"

[quantities.pe_vacuum_energy]
h5path = "PerturbedEquilibrium/Energies/vacuum_energy"
type = "real_scalar"
extract = "value"
label = "PE vacuum energy"
noise_threshold = 1e-10
order = 92
class = "physics_converged"

[quantities.pe_surface_energy]
h5path = "PerturbedEquilibrium/Energies/surface_energy"
type = "real_scalar"
extract = "value"
label = "PE surface energy"
noise_threshold = 1e-10
order = 93
class = "physics_converged"

[quantities.pe_toroidal_torque]
h5path = "PerturbedEquilibrium/Energies/toroidal_torque"
type = "real_scalar"
extract = "value"
label = "PE toroidal torque"
noise_threshold = 1e-12
order = 94
class = "physics_converged"

# NTV (neoclassical toroidal viscosity) toroidal torque T_φ [N·m] from the
# [KineticForces] FGAR method (pressure moment) — a diagnostic computed on top of
# the ideal FFS + PE result. Absent (N/A) for refs without a [KineticForces]
# section. Threshold is a noise floor for the adaptive-quadrature result; tune if
# run-to-run jitter appears.
[quantities.ntv_torque_fgar]
h5path = "KineticForces/fgar/total_torque"
type = "real_scalar"
extract = "value"
label = "NTV torque FGAR [N·m]"
noise_threshold = 1e-2
order = 95
class = "physics_converged"

# NTV kinetic energy δW_k = Im(T)/(2n) [J] through the same post-PE FGAR path.
# Tracked at a tighter threshold — it isolates the energy component the
# bounce-averaging chain moves most.
[quantities.ntv_energy_fgar]
h5path = "KineticForces/fgar/total_energy"
type = "real_scalar"
extract = "value"
label = "NTV kinetic energy dW FGAR [J]"
noise_threshold = 1e-3
order = 96
class = "physics_converged"

# Profiles (checksums)
[quantities.q_profile]
h5path = "Equilibrium/Profiles/q"
type = "real_vector"
extract = "checksum"
label = "q profile (checksum)"
noise_threshold = 0
order = 70
class = "physics_converged"

[quantities.pressure_profile]
h5path = "Equilibrium/Profiles/mu0p"
type = "real_vector"
extract = "checksum"
label = "pressure profile (checksum)"
noise_threshold = 0
order = 71
class = "physics_converged"

# Local stability profiles (local_stability_flag = true). Checksums hash the full
# profile so they are robust to NaN edge-surface entries and catch any change.
[quantities.locstab_di]
h5path = "LocalStability/D_I"
type = "real_vector"
extract = "checksum"
label = "Mercier D_I profile (checksum)"
noise_threshold = 0
order = 72
class = "physics_converged"

[quantities.locstab_dr]
h5path = "LocalStability/D_R"
type = "real_vector"
extract = "checksum"
label = "resistive interchange D_R profile (checksum)"
noise_threshold = 0
order = 73
class = "physics_converged"

[quantities.locstab_ballooning_dp]
h5path = "LocalStability/ballooning_Delta_prime"
type = "real_vector"
extract = "checksum"
label = "ballooning Delta' profile (checksum)"
noise_threshold = 0
order = 74
class = "physics_converged"

# Error fields — per-coil-set overlap with the full-window dominant mode and its rigid shift/tilt
# sensitivities. Singular vectors carry an arbitrary phase, so only magnitudes are tracked; the
# in-plane components of a whole n=1-phased array vanish by symmetry, so the norms track the
# vertical shift and axial tilt that survive.
[quantities.ef_delta_nominal]
h5path = "ErrorFields/CoilSensitivities/DominantMode/delta_nominal"
type = "complex_vector"
extract = "abs_first"
label = "|delta_nominal| of coil set 1"
noise_threshold = 1e-10
order = 86

[quantities.ef_shift_sensitivity]
h5path = "ErrorFields/CoilSensitivities/DominantMode/shift_sensitivity"
type = "complex_vector"
extract = "norm"
label = "||ddelta/d(shift)|| over coil sets"
noise_threshold = 1e-10
order = 87

[quantities.ef_tilt_sensitivity]
h5path = "ErrorFields/CoilSensitivities/DominantMode/tilt_sensitivity"
type = "complex_vector"
extract = "norm"
label = "||ddelta/d(tilt)|| over coil sets"
noise_threshold = 1e-10
order = 88

# Runtime
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
class = "diagnostic"

# Root-area-weighted (coordinate-invariant) forcing field b̃ on the control surface: the
# applied coil spectrum pushed through the √(J|∇ψ|) weight operator. Tracks the field-space
# conversion that every ResponseMatrices/ field-space output depends on.
[quantities.forcing_b_rootarea_norm]
h5path = "PerturbedEquilibrium/forcing_b_root_area"
type = "complex_vector"
extract = "norm"
label = "||forcing b~|| (root-area-weighted)"
noise_threshold = 1e-10
order = 1000
class = "physics_converged"
