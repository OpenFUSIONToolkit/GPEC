# Regression case: DIII-D-like n=1 ideal stability + perturbed equilibrium.
# Tracks energies, singular-surface metrics, Δ' (BVP diagonal), and resonant-flux
# diagnostics for the canonical DIIID-like fixture. Each [quantities.*] block names an
# HDF5 path in the run output, how to extract it, and the noise floor below which a
# difference is treated as zero. Run via the regression-harness (see CLAUDE.md).
[case]
name = "diiid_n1"
description = "DIII-D-like equilibrium, n=1, ideal + perturbed equilibrium"
example_dir = "examples/DIIID-like_ideal_example"

# Energies — leading eigenvalues at the final truncation (psilim). eigenmode_* are now power-normalized (Φ-space, Jacobian-invariant); ξ-space counterparts live under FreeBoundaryStability/XiNorm/ and are not tracked.
[quantities.et_real]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "Power Normalized total energy Re(et[1])"
noise_threshold = 1e-10
order = 10

[quantities.et_imag]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "imag_first"
label = "Power Normalized total energy Im(et[1])"
noise_threshold = 1e-10
order = 11

[quantities.ep_real]
h5path = "FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "real_first"
label = "Power Normalized plasma energy Re(ep[1])"
noise_threshold = 1e-10
order = 12

[quantities.ev_real]
h5path = "FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "real_first"
label = "Power Normalized vacuum energy Re(ev[1])"
noise_threshold = 1e-10
order = 13

[quantities.vacuum_eigenvalue]
h5path = "FreeBoundaryStability/XiNorm/vacuum_eigenvalue"
type = "real_scalar"
extract = "value"
label = "vacuum matrix min eigenvalue (XiNorm)"
noise_threshold = 1e-10
order = 14

# Energies — full eigenvalue arrays
[quantities.ep_all]
h5path = "FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized plasma energy (all)"
noise_threshold = 1e-10
order = 20

[quantities.ev_all]
h5path = "FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized vacuum energy (all)"
noise_threshold = 1e-10
order = 21

[quantities.et_all]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized total energy (all)"
noise_threshold = 1e-10
order = 22

# Integration
[quantities.nstep]
h5path = "integration/nstep"
type = "int_scalar"
extract = "value"
label = "ODE steps (saved)"
noise_threshold = 0
order = 30

[quantities.nstep_total]
h5path = "integration/nstep_total"
type = "int_scalar"
extract = "value"
label = "ODE steps (total)"
noise_threshold = 0
order = 31

# Equilibrium
[quantities.q0]
h5path = "equil/q0"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-12
order = 40

[quantities.q95]
h5path = "equil/q95"
type = "real_scalar"
extract = "value"
label = "q95"
noise_threshold = 1e-12
order = 41

[quantities.betat]
h5path = "equil/betat"
type = "real_scalar"
extract = "value"
label = "beta_t"
noise_threshold = 1e-12
order = 42

[quantities.betan]
h5path = "equil/betan"
type = "real_scalar"
extract = "value"
label = "beta_n"
noise_threshold = 1e-12
order = 43

[quantities.li1]
h5path = "equil/li1"
type = "real_scalar"
extract = "value"
label = "internal inductance li1"
noise_threshold = 1e-12
order = 44

[quantities.li2]
h5path = "equil/li2"
type = "real_scalar"
extract = "value"
label = "internal inductance li2"
noise_threshold = 1e-12
order = 45

[quantities.li3]
h5path = "equil/li3"
type = "real_scalar"
extract = "value"
label = "internal inductance li3"
noise_threshold = 1e-12
order = 46

[quantities.betap1]
h5path = "equil/betap1"
type = "real_scalar"
extract = "value"
label = "poloidal beta betap1"
noise_threshold = 1e-12
order = 47

[quantities.betap2]
h5path = "equil/betap2"
type = "real_scalar"
extract = "value"
label = "poloidal beta betap2"
noise_threshold = 1e-12
order = 48

[quantities.betap3]
h5path = "equil/betap3"
type = "real_scalar"
extract = "value"
label = "poloidal beta betap3"
noise_threshold = 1e-12
order = 49

[quantities.betaj]
h5path = "equil/betaj"
type = "real_scalar"
extract = "value"
label = "current beta betaj"
noise_threshold = 1e-12
order = 57

[quantities.volume]
h5path = "equil/volume"
type = "real_scalar"
extract = "value"
label = "plasma volume"
noise_threshold = 1e-12
order = 58

[quantities.crnt]
h5path = "equil/crnt"
type = "real_scalar"
extract = "value"
label = "plasma current"
noise_threshold = 1e-12
order = 59

[quantities.bt0]
h5path = "equil/bt0"
type = "real_scalar"
extract = "value"
label = "toroidal field bt0"
noise_threshold = 1e-12
order = 62

[quantities.bwall]
h5path = "equil/bwall"
type = "real_scalar"
extract = "value"
label = "wall field bwall"
noise_threshold = 1e-12
order = 63

[quantities.aratio]
h5path = "equil/aratio"
type = "real_scalar"
extract = "value"
label = "aspect ratio"
noise_threshold = 1e-12
order = 64

[quantities.kappa]
h5path = "equil/kappa"
type = "real_scalar"
extract = "value"
label = "elongation kappa"
noise_threshold = 1e-12
order = 65

# Singular surfaces
[quantities.msing]
h5path = "singular/msing"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0
order = 50

[quantities.sing_psi]
h5path = "singular/psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8
order = 51

[quantities.sing_q]
h5path = "singular/q"
type = "real_vector"
extract = "all_real"
label = "singular q values"
noise_threshold = 1e-8
order = 52

# Mode numbers
[quantities.mpert]
h5path = "info/mpert"
type = "int_scalar"
extract = "value"
label = "mpert"
noise_threshold = 0
order = 60

[quantities.npert]
h5path = "info/npert"
type = "int_scalar"
extract = "value"
label = "npert"
noise_threshold = 0
order = 61

# Tearing stability Δ' — canonical STRIDE BVP matrix diagonal (replaces the
# previous `perturbed_equilibrium/singular_coupling/delta_prime` track, which
# was a per-surface stub computed by SingularCoupling from (rbwp1-lbwp1)/(2π·χ').
# Per-surface Δ' is now de-emphasized — see PR 178 notes — and SingularCoupling
# instead reads this BVP matrix diagonal.
[quantities.delta_prime]
h5path = "singular/delta_prime_matrix"
type = "complex_matrix"
extract = "diagonal_complex"
label = "delta prime (BVP diagonal)"
noise_threshold = 1e-8
order = 80

[quantities.island_half_width]
h5path = "perturbed_equilibrium/singular_coupling/island_half_width"
type = "real_vector"
extract = "all_real"
label = "island half-widths"
noise_threshold = 1e-8
order = 81

[quantities.chirikov_parameter]
h5path = "perturbed_equilibrium/singular_coupling/chirikov_parameter"
type = "real_vector"
extract = "all_real"
label = "Chirikov parameter"
noise_threshold = 1e-8
order = 82

[quantities.resonant_flux]
h5path = "perturbed_equilibrium/singular_coupling/resonant_flux"
type = "complex_vector"
extract = "norm"
label = "||resonant flux||"
noise_threshold = 1e-8
order = 83

[quantities.resonant_flux_all]
h5path = "perturbed_equilibrium/singular_coupling/resonant_flux"
type = "complex_vector"
extract = "all_complex"
label = "resonant flux Phi_res"
noise_threshold = 1e-8

# Perturbed equilibrium: energies
[quantities.pe_plasma_energy]
h5path = "perturbed_equilibrium/energies/plasma_energy"
type = "real_scalar"
extract = "value"
label = "PE plasma energy"
noise_threshold = 1e-10
order = 91

[quantities.pe_vacuum_energy]
h5path = "perturbed_equilibrium/energies/vacuum_energy"
type = "real_scalar"
extract = "value"
label = "PE vacuum energy"
noise_threshold = 1e-10
order = 92

[quantities.pe_surface_energy]
h5path = "perturbed_equilibrium/energies/surface_energy"
type = "real_scalar"
extract = "value"
label = "PE surface energy"
noise_threshold = 1e-10
order = 93

[quantities.pe_toroidal_torque]
h5path = "perturbed_equilibrium/energies/toroidal_torque"
type = "real_scalar"
extract = "value"
label = "PE toroidal torque"
noise_threshold = 1e-12
order = 94

# Profiles (checksums)
[quantities.q_profile]
h5path = "splines/profiles/q"
type = "real_vector"
extract = "checksum"
label = "q profile (checksum)"
noise_threshold = 0
order = 70

[quantities.pressure_profile]
h5path = "splines/profiles/mu0p"
type = "real_vector"
extract = "checksum"
label = "pressure profile (checksum)"
noise_threshold = 0
order = 71

# Local stability profiles (local_stability_flag = true). Checksums hash the full
# profile so they are robust to NaN edge-surface entries and catch any change.
[quantities.locstab_di]
h5path = "locstab/di"
type = "real_vector"
extract = "checksum"
label = "Mercier D_I profile (checksum)"
noise_threshold = 0
order = 72

[quantities.locstab_dr]
h5path = "locstab/dr"
type = "real_vector"
extract = "checksum"
label = "resistive interchange D_R profile (checksum)"
noise_threshold = 0
order = 73

[quantities.locstab_ballooning_dp]
h5path = "locstab/ballooning_Delta_prime"
type = "real_vector"
extract = "checksum"
label = "ballooning Delta' profile (checksum)"
noise_threshold = 0
order = 74

# Runtime
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
