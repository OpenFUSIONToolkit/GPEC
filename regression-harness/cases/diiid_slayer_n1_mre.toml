# Regression case: DIII-D-like H-mode n=1 modified Rutherford equation (MRE) behind the toroidal SLAYER gate.
# A variant of diiid_slayer_n1_toroidal (its deck, overrides and quantities) plus [Tearing.ModifiedRutherford] with
# polarization and saturation on, so the classical, saturation, bootstrap, Lütjens curvature and polarization terms,
# the gate and the roots are tracked.
# Each [quantities.*] block names an HDF5 path in the run output, how to extract it,
# and the noise floor below which a difference is treated as zero.
[case]
name = "diiid_slayer_n1_mre"
base = "diiid_slayer_n1_toroidal"   # Inherit example_dir, [quantities.*] and [overrides] from this case
description = "DIII-D-like H-mode, n=1, modified Rutherford equation with polarization and saturation behind the toroidal SLAYER gate"

[overrides]
"Tearing.ModifiedRutherford.polarization" = true   # Ion polarization term on (off by default)
"Tearing.ModifiedRutherford.saturation" = true     # Finite-width saturation term on (off by default)

# Surface coefficients the terms are built from.
[quantities.mre_D_nc]
h5path = "Tearing/ModifiedRutherford/PerSurface/D_nc"
type = "real_vector"
extract = "all_real"
label = "MRE bootstrap coefficient D_nc"
noise_threshold = 1e-8
order = 10
class = "physics_converged"

[quantities.mre_C_sat]
h5path = "Tearing/ModifiedRutherford/PerSurface/C_sat"
type = "real_vector"
extract = "all_real"
label = "MRE saturation coefficient C_sat"
noise_threshold = 1e-6
order = 12
class = "physics_converged"

[quantities.mre_D_c]
h5path = "Tearing/ModifiedRutherford/PerSurface/D_c"
type = "real_vector"
extract = "all_real"
label = "MRE Lütjens critical offset D_c"
noise_threshold = 1e-8
order = 14
class = "physics_converged"

[quantities.mre_w_ib]
h5path = "Tearing/ModifiedRutherford/PerSurface/w_ib"
type = "real_vector"
extract = "all_real"
label = "MRE ion banana width w_ib (psi_N)"
noise_threshold = 1e-10
order = 16
class = "physics_converged"

# Roots: seed thresholds and saturated widths per surface (NaN where absent), and their minimum.
[quantities.mre_w_m]
h5path = "Tearing/ModifiedRutherford/PerSurface/w_m"
type = "real_vector"
extract = "all_real"
label = "MRE seed threshold w_m (psi_N)"
noise_threshold = 1e-8
order = 20
class = "physics_converged"

[quantities.mre_w_sat]
h5path = "Tearing/ModifiedRutherford/PerSurface/w_sat"
type = "real_vector"
extract = "all_real"
label = "MRE saturated width w_sat (psi_N)"
noise_threshold = 1e-8
order = 22
class = "physics_converged"

[quantities.mre_w_m_star]
h5path = "Tearing/ModifiedRutherford/w_m_star"
type = "real_scalar"
extract = "value"
label = "MRE smallest seed threshold w_m* (psi_N)"
noise_threshold = 1e-8
order = 24
class = "physics_converged"

[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
class = "diagnostic"
