# Regression case: DIII-D-like n=1 Callen vacuum-island threshold on the coil-driven perturbed equilibrium, and the
# modified Rutherford equation's Callen preset on the same forcing.
# The cylindrical intrinsic Δ′ (−2m/ρ) keeps the Fortran GPEC parity case and needs no extra Δ′ solve.
# Each [quantities.*] block names an HDF5 path in the run output, how to extract it,
# and the noise floor below which a difference is treated as zero.
[case]
name = "diiid_n1_callen"
description = "DIII-D-like, n=1, Callen vacuum-island threshold and cubic roots, and the MRE Callen preset, on the coil-driven perturbed equilibrium"
example_dir = "examples/DIIID-like_ideal_example"
remove_sections = ["LocalStability", "Ballooning", "ErrorFields", "KineticForces"]

[overrides]
"Tearing.Callen.delta_prime_source" = "cylindrical"   # Intrinsic Delta' -2m/rho, as Fortran GPEC 1.6.0; no extra Delta' solve
"Tearing.ModifiedRutherford.preset" = "callen"   # Reduce F(w) to Callen's steady state with the coil forcing
"Tearing.ModifiedRutherford.delta_prime_source" = "cylindrical"   # Intrinsic Delta' -2m/rho, as the Callen section

[quantities.callen_hw_v]
h5path = "Tearing/Callen/PerSurface/hw_v"
type = "real_vector"
extract = "all_real"
label = "Callen vacuum island half-width (psi_N)"
noise_threshold = 1e-10
order = 10
class = "physics_converged"

[quantities.callen_hw_v_crit]
h5path = "Tearing/Callen/PerSurface/hw_v_crit"
type = "real_vector"
extract = "all_real"
label = "Callen critical vacuum half-width (psi_N)"
noise_threshold = 1e-10
order = 12
class = "physics_converged"

[quantities.callen_b_crit]
h5path = "Tearing/Callen/PerSurface/b_crit"
type = "real_vector"
extract = "all_real"
label = "Callen critical vacuum resonant field (T)"
noise_threshold = 1e-12
order = 14
class = "physics_converged"

[quantities.callen_n_roots]
h5path = "Tearing/Callen/PerSurface/n_roots"
type = "real_vector"
extract = "all_real"
label = "Callen positive cubic roots per surface"
noise_threshold = 0
order = 16
class = "physics_converged"

[quantities.mre_callen_w_m]
h5path = "Tearing/ModifiedRutherford/PerSurface/w_m"
type = "real_vector"
extract = "all_real"
label = "MRE Callen preset: forced seed threshold full width (psi_N)"
noise_threshold = 1e-10
order = 18
class = "physics_converged"

[quantities.mre_callen_w_sat]
h5path = "Tearing/ModifiedRutherford/PerSurface/w_sat"
type = "real_vector"
extract = "all_real"
label = "MRE Callen preset: forced saturated full width (psi_N)"
noise_threshold = 1e-10
order = 20
class = "physics_converged"

[quantities.mre_callen_b_crit]
h5path = "Tearing/ModifiedRutherford/PerSurface/b_crit"
type = "real_vector"
extract = "all_real"
label = "MRE Callen preset: critical vacuum resonant field (T)"
noise_threshold = 1e-12
order = 22
class = "physics_converged"

[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
class = "diagnostic"
