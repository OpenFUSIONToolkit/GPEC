# Regression case: GGJ inner-layer Galerkin solver reference (Glasser & Wang 2020, Eq. 55).
# A "computed" case (kind = "computed", no example_dir) that calls solve_inner directly and
# tracks the interchange (Δ₊) / tearing (Δ₋) inner-layer coefficients. Each [quantities.*] block names an
# HDF5 path in the computed output, how to extract it, and the noise floor for diffs. The
# Δ₊ values are ~1e3–1e4, so the floors are relative: a change below 1e-10 of the value is noise.
[case]
name = "ggj_reference"
description = "GGJ inner-layer Galerkin solver, Glasser & Wang 2020 Eq. 55 with physical τ_A, τ_R, 1 kHz rotation (Q ≈ 0.22i)"
kind = "computed"

# interchange (Δ₊) / tearing (Δ₋) from solve_inner(GGJModel(:galerkin), glasser_wang_2020_eq55(; taua=2.11226e-7, taur=0.968219), 2πi·10³)
[quantities.delta_interchange_real]
h5path = "ggj/delta_interchange_real"
type = "real_scalar"
extract = "value"
label = "Re(Δ₊ interchange)"
noise_threshold = 1e-10
relative_threshold = 1e-10
order = 10

[quantities.delta_interchange_imag]
h5path = "ggj/delta_interchange_imag"
type = "real_scalar"
extract = "value"
label = "Im(Δ₊ interchange)"
noise_threshold = 1e-10
relative_threshold = 1e-10
order = 11

[quantities.delta_tearing_real]
h5path = "ggj/delta_tearing_real"
type = "real_scalar"
extract = "value"
label = "Re(Δ₋ tearing)"
noise_threshold = 1e-10
relative_threshold = 1e-10
order = 12

[quantities.delta_tearing_imag]
h5path = "ggj/delta_tearing_imag"
type = "real_scalar"
extract = "value"
label = "Im(Δ₋ tearing)"
noise_threshold = 1e-10
relative_threshold = 1e-10
order = 13

[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 90
