# Regression case: Solovev n=1 ideal stability with Gaussian reductions every few steps.
# Reuses the Solovev_ideal_example deck via [overrides] with ucrit = 2, so a ucrit reduction
# regularly fires a step or two before an ideal rational-surface crossing. The crossing must still
# remove the resonant solution; if it removes another one, et[1] lands far from solovev_n1's value.
# Each [quantities.*] block names an HDF5 path in the run output, how to extract it,
# and the noise floor below which a difference is treated as zero.
[case]
name = "solovev_n1_frequent_reduction"
description = "Solovev analytical equilibrium, n=1, ideal stability, ucrit = 2 so reductions land just before the rational-surface crossings"
example_dir = "examples/Solovev_ideal_example"

# Reduce whenever the solution-norm spread exceeds 2, at a tight Euler-Lagrange tolerance.
[overrides]
"ForceFreeStates.ucrit" = 2.0
"ForceFreeStates.eulerlagrange_tolerance" = 1e-10

# Energies — leading generalized (W,N) pencil eigenvalues at the final truncation (psilim).
[quantities.et_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "total energy Re(et[1])"
noise_threshold = 1e-10
order = 10
class = "physics_converged"

[quantities.et_imag]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "imag_first"
label = "total energy Im(et[1])"
noise_threshold = 1e-10
order = 11
class = "physics_converged"

[quantities.ep_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "real_first"
label = "plasma energy Re(ep[1])"
noise_threshold = 1e-10
order = 12
class = "physics_converged"

[quantities.ev_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "real_first"
label = "vacuum energy Re(ev[1])"
noise_threshold = 1e-10
order = 13
class = "physics_converged"
