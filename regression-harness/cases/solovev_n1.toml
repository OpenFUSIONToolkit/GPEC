[case]
name = "solovev_n1"
description = "Solovev analytical equilibrium, n=1, ideal stability"
example_dir = "examples/Solovev_ideal_example"

# Energies — leading eigenvalues at the final truncation (psilim). eigenmode_* are now power-normalized (Φ-space, Jacobian-invariant); ξ-space counterparts live under FreeBoundaryStability/XiNorm/ and are not tracked.
[quantities.et_real]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "Power Normalized total energy Re(et[1])"
noise_threshold = 1e-10
order = 10

[quantities.et_imag]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "imag_first"
label = "Power Normalized total energy Im(et[1])"
noise_threshold = 1e-10
order = 11

[quantities.ep_real]
h5path = "FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "real_first"
label = "Power Normalized plasma energy Re(ep[1])"
noise_threshold = 1e-10
order = 12

[quantities.ev_real]
h5path = "FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "real_first"
label = "Power Normalized vacuum energy Re(ev[1])"
noise_threshold = 1e-10
order = 13

[quantities.vacuum_eigenvalue]
h5path = "FreeBoundaryStability/XiNorm/vacuum_eigenvalue"
type = "real_scalar"
extract = "value"
label = "vacuum matrix min eigenvalue (XiNorm)"
noise_threshold = 1e-10
order = 14

# Energies — full eigenvalue arrays
[quantities.ep_all]
h5path = "FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized plasma energy (all)"
noise_threshold = 1e-10
order = 20

[quantities.ev_all]
h5path = "FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized vacuum energy (all)"
noise_threshold = 1e-10
order = 21

[quantities.et_all]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized total energy (all)"
noise_threshold = 1e-10
order = 22

# Integration
[quantities.nstep]
h5path = "integration/nstep"
type = "int_scalar"
extract = "value"
label = "ODE steps (saved)"
noise_threshold = 0
order = 30

[quantities.nstep_total]
h5path = "integration/nstep_total"
type = "int_scalar"
extract = "value"
label = "ODE steps (total)"
noise_threshold = 0
order = 31

# Equilibrium
[quantities.q0]
h5path = "equil/q0"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-12
order = 40

[quantities.q95]
h5path = "equil/q95"
type = "real_scalar"
extract = "value"
label = "q95"
noise_threshold = 1e-12
order = 41

[quantities.betat]
h5path = "equil/betat"
type = "real_scalar"
extract = "value"
label = "beta_t"
noise_threshold = 1e-12
order = 42

[quantities.betan]
h5path = "equil/betan"
type = "real_scalar"
extract = "value"
label = "beta_n"
noise_threshold = 1e-12
order = 43

# Singular surfaces
[quantities.msing]
h5path = "singular/msing"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0
order = 50

[quantities.sing_psi]
h5path = "singular/psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8
order = 51

[quantities.sing_q]
h5path = "singular/q"
type = "real_vector"
extract = "all_real"
label = "singular q values"
noise_threshold = 1e-8
order = 52

# Mode numbers
[quantities.mpert]
h5path = "info/mpert"
type = "int_scalar"
extract = "value"
label = "mpert"
noise_threshold = 0
order = 60

[quantities.npert]
h5path = "info/npert"
type = "int_scalar"
extract = "value"
label = "npert"
noise_threshold = 0
order = 61

# Profiles (checksums for fast comparison of large arrays)
[quantities.q_profile]
h5path = "splines/profiles/q"
type = "real_vector"
extract = "checksum"
label = "q profile (checksum)"
noise_threshold = 0
order = 70

[quantities.pressure_profile]
h5path = "splines/profiles/mu0p"
type = "real_vector"
extract = "checksum"
label = "pressure profile (checksum)"
noise_threshold = 0
order = 71

# Energy-principle reconstruction (recon_flag): δW reconstructed for the least-stable mode.
[quantities.recon_dW_total_v1]
h5path = "recon/dW_total_v1"
type = "real_scalar"
extract = "value"
label = "recon v1 2mu0 dW total (real-space)"
noise_threshold = 1e-8
order = 72

[quantities.recon_dW_volume_v2]
h5path = "recon/dW_volume_v2"
type = "real_scalar"
extract = "value"
label = "recon v2 dW volume (matrix form)"
noise_threshold = 1e-10
order = 73

[quantities.recon_dW_boundary_v2]
h5path = "recon/dW_boundary_v2"
type = "real_scalar"
extract = "value"
label = "recon v2 dW boundary (psio2 ep)"
noise_threshold = 1e-10
order = 74

[quantities.recon_dst_checksum]
h5path = "recon/dst"
type = "real_vector"
extract = "checksum"
label = "recon K xi_n^2 density (checksum)"
noise_threshold = 0
order = 75

[quantities.recon_epf_checksum]
h5path = "recon/epf"
type = "real_vector"
extract = "checksum"
label = "recon C^2/mu0 density (checksum)"
noise_threshold = 0
order = 76

# Runtime (special: not from H5)
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
