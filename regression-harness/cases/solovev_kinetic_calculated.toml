# Regression case: Solovev n=1 with the "calculated" kinetic path at full strength.
# Guards the real KineticForces (PENTRC-style) physics path against drift. Each
# [quantities.*] block names an HDF5 path in the run output, how to extract it, and the
# noise floor below which a difference is treated as zero.
[case]
name = "solovev_kinetic_calculated"
description = "Solovev, n=1, kinetic_source=calculated, kinetic_factor=1.0, mode-converged band (delta_m=8, mpert=32). et[1]≈1.894-1.525i with the pressure-consistent kinetic.dat (n·T tied to the Solovev P₀≈4.27e4 Pa)."
example_dir = "examples/Solovev_kinetic_calculated_example"

# Energies — leading eigenvalues
[quantities.et_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "total energy Re(et[1])"
noise_threshold = 1e-10

[quantities.et_imag]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "imag_first"
label = "total energy Im(et[1])"
noise_threshold = 1e-10

[quantities.ep_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "real_first"
label = "plasma energy Re(ep[1])"
noise_threshold = 1e-10

[quantities.ev_real]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "real_first"
label = "vacuum energy Re(ev[1])"
noise_threshold = 1e-10

# Energies — full eigenvalue arrays
[quantities.et_all]
h5path = "ForceFreeStates/FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "all_complex"
label = "total energy (all)"
noise_threshold = 1e-10

# Integration
[quantities.nstep]
h5path = "ForceFreeStates/Solutions/ForwardIntegration/nstep"
type = "int_scalar"
extract = "value"
label = "ODE steps (saved)"
noise_threshold = 0

[quantities.nstep_total]
h5path = "ForceFreeStates/Solutions/ForwardIntegration/nstep_total"
type = "int_scalar"
extract = "value"
label = "ODE steps (total)"
noise_threshold = 0

# Equilibrium
[quantities.q0]
h5path = "Equilibrium/q_axis"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-12

[quantities.q95]
h5path = "Equilibrium/q_95"
type = "real_scalar"
extract = "value"
label = "q95"
noise_threshold = 1e-12

# Singular surfaces
[quantities.msing]
h5path = "SingularSurfaces/rational_count"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0

[quantities.sing_psi]
h5path = "SingularSurfaces/rational_psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8

[quantities.sing_q]
h5path = "SingularSurfaces/rational_q"
type = "real_vector"
extract = "all_real"
label = "singular q values"
noise_threshold = 1e-8

# Mode numbers
[quantities.mpert]
h5path = "Info/mpert"
type = "int_scalar"
extract = "value"
label = "mpert"
noise_threshold = 0

[quantities.npert]
h5path = "Info/npert"
type = "int_scalar"
extract = "value"
label = "npert"
noise_threshold = 0

# Perturbed equilibrium — guards the kinetic branch of compute_clebsch_displacements.
# This is the only case that runs PE on a kinetic solve; without it that branch is untested.
[quantities.pe_clebsch_alpha_norm]
h5path = "PerturbedEquilibrium/Response/xi_clebsch_alpha"
type = "complex_matrix"
extract = "norm"
label = "||xi_clebsch_alpha||"
noise_threshold = 1e-12

[quantities.pe_clebsch_psi1_norm]
h5path = "PerturbedEquilibrium/Response/dxi_clebsch_psidpsi"
type = "complex_matrix"
extract = "norm"
label = "||dxi_clebsch_psi/dpsi||"
noise_threshold = 1e-12

[quantities.pe_b_theta_reg_norm]
h5path = "PerturbedEquilibrium/Response/Jb_theta_reg"
type = "complex_matrix"
extract = "norm"
label = "||Jb_theta_reg||"
noise_threshold = 1e-12

# Runtime (special: not from H5)
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
