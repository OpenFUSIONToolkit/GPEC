# Regression case: LAR analytic equilibrium, n=1, outer-region Galerkin Δ′ with the banded
# Cholesky solver (gal_solver = "cholesky", zpbtrf/zpbtrs). The Galerkin matrix is positive
# definite here, so this is the Cholesky path's end-to-end track: resonant-surface inventory,
# the PEST-3 Δ matrix (diagonal and every element), the raw outer Δ′ norm, and the asymptotics.
# Each [quantities.*] block names an HDF5 path in the run output, how to extract it,
# and the noise floor below which a difference is treated as zero.
[case]
name = "lar_gal_cholesky"
description = "LAR analytic equilibrium, n=1, Galerkin Δ′ via the banded Cholesky solver"
example_dir = "examples/LAR_gal_cholesky_example"

# Number and location of the resonant surfaces in the gal domain
[quantities.gal_msing]
h5path = "ForceFreeStates/Solutions/GalerkinIntegration/rational_count"
type = "int_scalar"
extract = "value"
label = "gal # singular surfaces"
noise_threshold = 0
order = 10

[quantities.gal_sing_q]
h5path = "ForceFreeStates/Solutions/GalerkinIntegration/rational_q"
type = "real_vector"
extract = "all_real"
label = "gal singular q values"
noise_threshold = 1e-8
order = 11

# PEST-3 Δ matching matrix — per-surface diagonal (the tearing Δ′) and every element
[quantities.gal_pest3_delta_diag]
h5path = "SingularSurfaces/Delta_prime_matrix"
type = "complex_matrix"
extract = "diagonal_complex"
label = "gal PEST3 Δ diagonal"
noise_threshold = 1e-6
order = 20

[quantities.gal_pest3_delta_all]
h5path = "SingularSurfaces/Delta_prime_matrix"
type = "complex_matrix"
extract = "all_complex"
label = "gal PEST3 Δ (all)"
noise_threshold = 1e-6
order = 21

# Raw outer Δ′ matrix (2·msing × 2·msing) — Frobenius norm catches any element drift
[quantities.gal_delta_norm]
h5path = "SingularSurfaces/Delta_prime_raw"
type = "complex_matrix"
extract = "norm"
label = "||gal Δ′ matrix||"
noise_threshold = 1e-6
order = 22

# Mercier index and resonant exponents per surface
[quantities.gal_di]
h5path = "ForceFreeStates/Solutions/GalerkinIntegration/D_I"
type = "real_vector"
extract = "all_real"
label = "gal D_I per surface"
noise_threshold = 1e-8
order = 30

[quantities.gal_alpha]
h5path = "ForceFreeStates/Solutions/GalerkinIntegration/alpha"
type = "complex_vector"
extract = "all_complex"
label = "gal α per surface"
noise_threshold = 1e-8
order = 31

[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
