[case]
name = "tj_epsilon_pole"
description = "TJ analytic, ε = 0.66 near ideal-kink pole (Option B direct-GS)"
example_dir = "examples/TJ_epsilon_pole_example"

# Energies — leading eigenvalues.  δW_t should be very small (~0.01) because
# ε = 0.66 sits just inside the pole; if the (R,Z)→(r,w) inversion regresses,
# δW_t jumps by an order of magnitude.
[quantities.et_real]
h5path = "vacuum/et"
type = "complex_vector"
extract = "real_first"
label = "total energy Re(et[1])"
noise_threshold = 1e-10

[quantities.et_imag]
h5path = "vacuum/et"
type = "complex_vector"
extract = "imag_first"
label = "total energy Im(et[1])"
noise_threshold = 1e-10

[quantities.ep_real]
h5path = "vacuum/ep"
type = "complex_vector"
extract = "real_first"
label = "plasma energy Re(ep[1])"
noise_threshold = 1e-10

[quantities.ev_real]
h5path = "vacuum/ev"
type = "complex_vector"
extract = "real_first"
label = "vacuum energy Re(ev[1])"
noise_threshold = 1e-10

# Integration
[quantities.nstep]
h5path = "integration/nstep"
type = "int_scalar"
extract = "value"
label = "ODE steps (saved)"
noise_threshold = 0

[quantities.nstep_total]
h5path = "integration/nstep_total"
type = "int_scalar"
extract = "value"
label = "ODE steps (total)"
noise_threshold = 0

# Equilibrium — sanity (should be the near-pole TJ values, psio≈2.72, qmax≈4.0)
[quantities.q0]
h5path = "equil/q0"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-10

[quantities.qmax]
h5path = "equil/qmax"
type = "real_scalar"
extract = "value"
label = "qmax"
noise_threshold = 1e-10

[quantities.psio]
h5path = "equil/psio"
type = "real_scalar"
extract = "value"
label = "psio"
noise_threshold = 1e-10

# Singular surfaces — at ε=0.66 we expect 2/1, 5/2 (excluded by qlow), 3/1, 7/2.
[quantities.msing]
h5path = "singular/msing"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0

[quantities.sing_psi]
h5path = "singular/psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8

[quantities.sing_q]
h5path = "singular/q"
type = "real_vector"
extract = "all_real"
label = "singular q values"
noise_threshold = 1e-8

# Δ' matrix diagonal — the headline quantities for the pole-approach test.
# Near the pole dp21 ≈ +100 and dp31 ≈ +650; both should climb by orders of
# magnitude if anyone regresses the εa³·L shape terms in tj_run_direct.
[quantities.delta_prime_matrix]
h5path = "singular/delta_prime_matrix"
type = "complex_vector"
extract = "all_complex"
label = "Δ' matrix"
noise_threshold = 1e-6

# Mode numbers
[quantities.mpert]
h5path = "info/mpert"
type = "int_scalar"
extract = "value"
label = "mpert"
noise_threshold = 0

[quantities.npert]
h5path = "info/npert"
type = "int_scalar"
extract = "value"
label = "npert"
noise_threshold = 0

# Runtime
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
