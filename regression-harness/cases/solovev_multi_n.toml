# Regression case: Solovev multi-n (n = 1 and 2) ideal stability.
# Tracks the leading free-boundary energies and stability quantities for the analytic
# Solovev fixture swept over a toroidal mode-number range. Each [quantities.*] block names
# an HDF5 path, how to extract it, and the noise floor below which a diff is treated as zero.
[case]
name = "solovev_multi_n"
description = "Solovev analytical equilibrium, multi-n, ideal stability"
example_dir = "examples/Solovev_ideal_example_multi_n"

# Energies — leading eigenvalues at the final truncation (psilim). eigenmode_* are now power-normalized (Φ-space, Jacobian-invariant); ξ-space counterparts live under FreeBoundaryStability/XiNorm/ and are not tracked.
[quantities.et_real]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "real_first"
label = "Power Normalized total energy Re(et[1])"
noise_threshold = 1e-10
order = 10

[quantities.et_imag]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "imag_first"
label = "Power Normalized total energy Im(et[1])"
noise_threshold = 1e-10
order = 11

[quantities.vacuum_eigenvalue]
h5path = "FreeBoundaryStability/XiNorm/vacuum_eigenvalue"
type = "real_scalar"
extract = "value"
label = "vacuum matrix min eigenvalue (XiNorm)"
noise_threshold = 1e-10
order = 14

# Energies — full eigenvalue arrays
[quantities.ep_all]
h5path = "FreeBoundaryStability/eigenmode_plasma_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized plasma energy (all)"
noise_threshold = 1e-10
order = 20

[quantities.ev_all]
h5path = "FreeBoundaryStability/eigenmode_vacuum_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized vacuum energy (all)"
noise_threshold = 1e-10
order = 21

[quantities.et_all]
h5path = "FreeBoundaryStability/eigenmode_energies"
type = "complex_vector"
extract = "all_complex"
label = "Power Normalized total energy (all)"
noise_threshold = 1e-10
order = 22

# Integration
[quantities.nstep]
h5path = "integration/nstep"
type = "int_scalar"
extract = "value"
label = "ODE steps (saved)"
noise_threshold = 0
order = 30

[quantities.nstep_total]
h5path = "integration/nstep_total"
type = "int_scalar"
extract = "value"
label = "ODE steps (total)"
noise_threshold = 0
order = 31

# Equilibrium
[quantities.q0]
h5path = "equil/q0"
type = "real_scalar"
extract = "value"
label = "q0"
noise_threshold = 1e-12
order = 40

[quantities.q95]
h5path = "equil/q95"
type = "real_scalar"
extract = "value"
label = "q95"
noise_threshold = 1e-12
order = 41

# Singular surfaces
[quantities.msing]
h5path = "singular/msing"
type = "int_scalar"
extract = "value"
label = "# singular surfaces"
noise_threshold = 0
order = 50

[quantities.sing_psi]
h5path = "singular/psi"
type = "real_vector"
extract = "all_real"
label = "singular psi locations"
noise_threshold = 1e-8
order = 51

# Mode numbers
[quantities.mpert]
h5path = "info/mpert"
type = "int_scalar"
extract = "value"
label = "mpert"
noise_threshold = 0
order = 60

[quantities.npert]
h5path = "info/npert"
type = "int_scalar"
extract = "value"
label = "npert"
noise_threshold = 0
order = 61

# Profiles (checksums)
[quantities.q_profile]
h5path = "splines/profiles/q"
type = "real_vector"
extract = "checksum"
label = "q profile (checksum)"
noise_threshold = 0
order = 70

# Runtime
[quantities.runtime]
h5path = ""
type = "runtime"
extract = "value"
label = "Runtime (s)"
noise_threshold = 0.0
order = 999
