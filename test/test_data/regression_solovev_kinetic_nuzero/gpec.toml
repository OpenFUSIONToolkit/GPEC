# Solovev n=1 collisionless-kinetic smoke fixture (nutype = "zero").
# Intentionally coarse (mpsi = 16, delta_m = 0) so the full-run test suite can
# exercise the real-x-space collisionless energy-integral path end-to-end; the
# test asserts only finiteness/sign of et[1]. The mode-converged eigenvalue is
# tracked separately by the solovev_kinetic_nuzero regression case.
[Equilibrium]
kinetic_file = "kinetic.dat"            # Kinetic-profile file (HDF5 GPEC kinetic schema or 6-column ASCII), read once into the equilibrium
jac_type = "pest"                       # Coordinate system (hamada, pest, boozer, equal_arc, park, custom)
grid_type = "core_edge_packed"          # Radial grid packing type
psilow = 1e-4                           # Lower limit of normalized flux coordinate
psihigh = 0.9995                        # Upper limit of normalized flux coordinate
mpsi = 16                               # Number of radial grid points
mtheta = 256                            # Number of poloidal grid points
newq0 = 0                               # Target on-axis safety factor q(0) (0 = use input value, -1 = flip axis extrapolation)
flux_surface_rtol = 1e-7                # Relative tolerance of the ODE solves that trace each flux surface

[Wall]
shape = "conformal"                     # Wall shape (conformal, elliptical, dee, mod_dee, file)
standoff_fraction = 0.2415              # Wall standoff in plasma minor radii
equal_arc_wall = true                   # Equal arc length distribution of nodes on wall

# Presence runs the LocalStability stage (Mercier D_I, resistive D_R, ballooning Δ', first α boundary); keys are the Ballooning keywords
[LocalStability]
theta_k = 0.0                 # Ballooning angle θ_k, used by both the profile scan and the α-boundary scan
alpha_boundary_scan = true    # Run the first ballooning α-boundary scan (a root find per ψ surface)

# Numerical settings of the ballooning scans
[Ballooning]
ode_tol = 1e-8                # Relative and absolute tolerance of the ballooning ODE integration behind Δ'
n_scan = 24                   # Resolution of the α scan for the first boundary
max_alpha_scale = 8.0         # Upper end of the α search, as a multiple of the experimental α
alpha_tol = 1e-3              # Bisection tolerance of the critical α, in the same multiples
psi_window = [0.1, 0.99]      # ψ_N range of the α scan; surfaces outside it are NaN

[ForceFreeStates]
vac_flag = true               # Compute plasma, vacuum, and total energies for free-boundary modes

dW_edge_scan_start = 0.99     # Edge dW(ψ) diagnostic scan band [dW_edge_scan_start, psilim]; set ≥ psilim to disable
qlow = 1.02                   # Integration initiated at q determined by min(q0, qlow)...
qhigh = 1e3                   # Integration terminated at q limit determined by min(qa, qhigh)...

nn = 1                         # Toroidal mode number, or consecutive numbers as a list
delta_mlow = 0                # Expands lower bound of Fourier harmonics
delta_mhigh = 0               # Expands upper bound of Fourier harmonics
mtheta_vacuum = 64                   # Number of points used in splines over poloidal angle at plasma-vacuum interface.

kinetic = "KineticForces"     # Kinetic source: the drift-kinetic matrices of the [KineticForces] model (omit for an ideal run)
integrator = "Forward" # Integration formalism, whose numerical settings are its own section: "Forward" (dense ξ, needed for [PerturbedEquilibrium]/kinetic), "Riccati" (chunked propagator BVP, unlocks the singular-surface Δ′ matrix), or "Galerkin" (outer-region singular Galerkin Δ′)
singfac_min = 1e-4            # Fractional distance from rational q at which ideal jump enforced

# Numerical settings of the forward integrator
[Forward]
eulerlagrange_tolerance = 1e-7 # Relative tolerance for ODE integration of Euler-Lagrange equations
renorm_threshold = 1e3        # Column-norm threshold that triggers solution renormalization

[KineticForces]
nutype = "zero"               # Collisionless operator — isolates the real-x-space collisionless energy integral

# Solovev analytic equilibrium parameters; this section selects the equilibrium. See SolovevConfig in src/Equilibrium.
[Solovev]
mr = 128       # Number of radial grid zones
mz = 128       # Number of axial grid zones
ma = 128       # Number of flux grid zones
elongation = 1.6 # Elongation
a = 0.33       # Minor radius
r0 = 1.0       # Major radius
q0 = 1.9       # Safety factor at the magnetic axis (O-point)
p0fac = 1      # Scale on-axis pressure (β changes; Φ, q fixed)
b0fac = 1      # Scale toroidal field at constant β (Bt changes; shape, β fixed)
f0fac = 1      # Scale toroidal field at constant pressure (β, q change; Φ, p, Bp fixed)
