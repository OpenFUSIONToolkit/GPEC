name: Regression Harness Unit Tests

# Unit tests for the regression harness's own logic (golden values, case loading), on
# synthetic data only. They load the harness project, not GPEC, so they run in minutes.
on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'regression-harness/**'
      - '.github/workflows/regression-harness-unit.yaml'
  push:
    branches:
      - main
      - develop
    paths:
      - 'regression-harness/**'
      - '.github/workflows/regression-harness-unit.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: regression-harness unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'

      - name: Instantiate the harness environment
        run: julia --project=regression-harness -e 'using Pkg; Pkg.instantiate()'

      - name: Run the harness unit tests
        run: julia --project=regression-harness regression-harness/test/runtests.jl
