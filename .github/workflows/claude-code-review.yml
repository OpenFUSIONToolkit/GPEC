name: Claude Code Review

on:
  issue_comment:
    types: [created]

jobs:
  claude-review:
    # Only run when explicitly requested via "@claude review" in a PR comment.
    # Does NOT trigger on subsequent commits, pushes, or other comments.
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude review')

    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Test coverage

            Use the repository's CLAUDE.md for guidance on style and conventions. Be constructive and helpful but not unnecessarily verbose in your feedback. Be neutral and objective, avoiding exaggerated praise. For positive feedback, it suffices to say one sentence like  "This will be useful for X reason". Do not use positive adjectives stronger than "useful" or "good". If you find flaws, do not worry about hurting feelings; just point them out clearly and suggest improvements.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
