# GPEC configuration for the TJ-analytic β (pressure factor) scan.
#
# The TJ-analytic equilibrium follows the analytic profile family of R. Fitzpatrick's
# TJ code (https://github.com/rfitzp/TJ): same f₁ / pressure / shape-ODE parameterization,
# fed through GPEC's own pipeline. The accompanying run_scan.jl reads this file, overrides
# only the scan parameter (TJ_ANALYTIC_INPUT.pc) per point, and writes a fresh gpec.toml
# into each tempdir. Every equilibrium parameter is embedded in [TJ_ANALYTIC_INPUT] below —
# there is no side-car TOML file.

[Equilibrium]
eq_type   = "tj_analytic"      # TJ-analytic model (inverse pipeline; Fitzpatrick https://github.com/rfitzp/TJ)
jac_type  = "hamada"           # Coordinate system (hamada, pest, boozer, equal_arc)
grid_type = "ldp"              # Radial grid packing type
psilow    = 0.01               # Lower limit of normalized flux coordinate
psihigh   = 0.995              # Upper limit of normalized flux coordinate
mpsi      = 128                # Number of radial grid points (0 = auto-compute from psi_accuracy)
mtheta    = 512                # Number of poloidal grid points

# TJ-analytic equilibrium parameters (cf. R. Fitzpatrick, TJ code, https://github.com/rfitzp/TJ).
# Geometry is FIXED at ε = a / R₀ = 0.4 / 2.0 = 0.2; run_scan.jl varies only `pc` per point.
[TJ_ANALYTIC_INPUT]
lar_r0 = 2.0                   # Major radius R₀ [m] (centerline radius of the magnetic axis)
lar_a  = 0.4                   # Minor radius a [m] (plasma half-width at the midplane; here ε = 0.2)
qc     = 1.5                   # On-axis safety factor q(r=0)
qa     = 3.6                   # Edge safety factor q(r=a)
pc     = 0.001                 # Normalized on-axis pressure (β-scan parameter; OVERRIDDEN per run by run_scan.jl)
mu     = 2.0                   # Pressure-profile peaking exponent in p₂(r) = pc·(1−r²)^μ
B0     = 12.0                  # On-axis toroidal field [T]
ma     = 128                   # TJ-analytic internal radial grid resolution (shape-ODE nodes)
mtau   = 128                   # TJ-analytic internal poloidal grid resolution (θ-spline nodes)

[Wall]
shape = "conformal"            # Wall shape (nowall, conformal, elliptical, dee, mod_dee, filepath)
a     = 20                     # Distance from plasma (conformal) or shape parameter (20× → effectively no wall)

[ForceFreeStates]
bal_flag = false               # Ideal MHD ballooning criterion for short wavelengths
mat_flag = true                # Construct coefficient matrices for diagnostic purposes
ode_flag = true                # Integrate ODEs for stability of the internal long-wavelength mode (must be true for GPEC)
vac_flag = true                # Compute plasma, vacuum, and total energies for free-boundary modes
mer_flag = true                # Evaluate the Mercier criterion

qlow         = 1.02            # Integration initiated at q determined by min(q0, qlow)
qhigh        = 3.6             # Integration terminated at q limit determined by min(qa, qhigh)
sing_start   = 0               # Start integration at the sing_start'th rational from the axis (psilow)

nn_low       = 1               # Smallest toroidal mode number to include
nn_high      = 1               # Largest toroidal mode number to include
delta_mlow   = 8               # Expands lower bound of Fourier harmonics
delta_mhigh  = 8               # Expands upper bound of Fourier harmonics
delta_mband  = 0               # Integration keeps only this wide a band of solutions (0 = full)
mthvac       = 960             # Number of points in splines over poloidal angle at the plasma-vacuum interface

eulerlagrange_tolerance = 1e-12 # Relative tolerance for ODE integration of Euler-Lagrange equations
singfac_min             = 1e-4 # Fractional distance from rational q at which ideal jump enforced
ucrit                   = 1e4  # Column-norm threshold that triggers solution renormalization
sing_order              = 6    # Order of the singular-surface (Frobenius) series expansion

use_parallel          = true   # Run parallel FM-propagator BVP path (unlocks singular/delta_prime_matrix)
parallel_threads      = 2      # BVP thread cap (1 = serial/bit-deterministic; 2 ≈ +20% speedup; ≥3 saturates)
populate_dense_xi     = false  # Append serial-EL pass for dense ξ; not needed without [PerturbedEquilibrium] (default false)
set_psilim_via_dmlim  = false  # FALSE for limited/analytical equilibria — rationals sparse, dmlim would chop too much edge
dmlim                 = 0.2    # Truncate integration at (last_rational_q + dmlim)/n (used when set_psilim_via_dmlim = true)
force_termination     = true   # Stop after force-free states (skip perturbed equilibrium)
write_outputs_to_HDF5 = true   # Write outputs to the HDF5 file
HDF5_filename         = "gpec.h5"  # Output HDF5 filename (run_scan.jl overrides this per scan point)
save_interval         = 3      # Save every Nth ODE step (1=all). Always saves near rational surfaces.
