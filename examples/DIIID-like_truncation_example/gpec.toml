# DIII-D-like H-mode equilibrium — n=1 truncation-only case for the resistive-layer overlap cap.
# Reuses the equilibrium and kinetic profiles of the sibling DIIID-like_ideal_example (referenced
# by relative path; not duplicated). psihigh is pushed well past the layer-overlap point (psi ~ 0.9985,
# where adjacent resistive layers first touch), so psilim_from_layer_overlap binds: the cap pulls qlim
# to 7 and dmlim steps back to 6.2, excluding q=7 and q=8. Ideal free-boundary stability only, with no local
# stability, forcing or perturbed equilibrium: the energies are kept so a regression case can pin
# what the capped domain does to the physics, not just to the bookkeeping.

[Run]
verbose = true                 # Log each stage's progress

[Equilibrium]
eq_filename = "../DIIID-like_ideal_example/TkMkr_D3Dlike_Hmode.geqdsk" # Path to equilibrium file
kinetic_file = "../DIIID-like_ideal_example/TkMkr_D3Dlike_Hmode_kinetic.h5" # Kinetic-profile file (HDF5 GPEC kinetic schema or 6-column ASCII), read once into the equilibrium
eq_type = "efit"               # Type of the input 2D equilibrium file
jac_type = "hamada"            # Coordinate system (hamada, pest, boozer, equal_arc, park, custom)
grid_type = "auto"             # Radial grid packing type ("auto" = two-pass measured-curvature grid)
psilow = 1e-4                  # Lower limit of normalized poloidal flux
psihigh = 0.9999               # Upper limit of normalized poloidal flux (past the psi ~ 0.9985 layer-overlap point, so the cap binds)
mpsi = 0                       # Number of radial grid intervals (0 = two-pass auto grid from psi_accuracy)
psi_accuracy = 0.001           # Target relative accuracy of splined profile derivatives for the auto grid
mtheta = 256                   # Number of poloidal grid points
newq0 = 0                      # Target on-axis safety factor q(0) (0 = use input value, -1 = flip axis extrapolation)
flux_surface_rtol = 1e-10      # Relative tolerance of the ODE solves that trace each flux surface

[ForceFreeStates]
vac_flag = true                # Compute plasma, vacuum, and total energies for free-boundary modes

dW_edge_scan_start = 1.0       # Edge dW(ψ) diagnostic scan band [dW_edge_scan_start, psilim]; set ≥ psilim to disable
qlow = 1.02                    # Integration initiated at q determined by min(q0, qlow)
qhigh = 1e3                    # Integration terminated at q limit determined by min(qa, qhigh)

nn = 1                         # Toroidal mode number, or consecutive numbers as a list
delta_mlow = 8                 # Expands lower bound of Fourier harmonics
delta_mhigh = 8                # Expands upper bound of Fourier harmonics

singfac_min = 1e-6             # Fractional distance from rational q at which ideal jump enforced

# Integrator selection and domain truncation (see ForceFreeStatesControl docstring for details)
integrator = "Forward" # Integration formalism, whose numerical settings are its own section: "Forward" (dense ξ, needed for [PerturbedEquilibrium]/kinetic), "Riccati" (chunked propagator BVP, unlocks the singular-surface Δ′ matrix), or "Galerkin" (outer-region singular Galerkin Δ′)
truncate_at_rational_offset = true # Truncate at (last_rational_q + rational_offset_fraction)/n — TRUE for diverted equilibria (q → ∞ at separatrix)
rational_offset_fraction  = 0.2    # Truncate integration at (last_rational_q + rational_offset_fraction)/n (used when truncate_at_rational_offset = true)
psilim_from_layer_overlap = true   # Cap psilim where adjacent resistive layers overlap (the scan is recorded either way)

# Numerical settings of the forward integrator
[Forward]
eulerlagrange_tolerance = 1e-10 # Relative tolerance for ODE integration of Euler-Lagrange equations

# The SLAYER layer closures the layer-overlap scan builds its widths with; there is no [Tearing] section, so no
# growth rates are computed. P_perp is pinned to the electron channel so the cap binds: with the default D_perp
# the layers are ~30% narrower and do not overlap inside psi = 1.
[SLAYER]
P_perp_model = "chi_perp_e"    # Perpendicular Prandtl number model (pinned; see above)
