# DIII-D-like H-mode equilibrium — synthetic 2/1 → 4/2 magnetic-island bifurcation.
# I-coil-only forcing (upper iu + lower il) engineered so the q=2 surface (ψ_N ≈ 0.518)
# is driven by a pure n=2 field → a 4/2 island (4 O-points). Run run_bifurcation.jl to
# sweep the n=1 amplitude through zero and see the 2 O-points → 4 O-points → 2 O-points
# bifurcation. The vacuum field-line trace resolves the multi-n coil field (n = 1…3).

[Equilibrium]
eq_filename = "../TkMkr_D3Dlike_Hmode.geqdsk" # Path to equilibrium file
eq_type = "efit"               # Type of the input 2D equilibrium file
jac_type = "hamada"            # Coordinate system (hamada, pest, boozer, equal_arc, park, custom)
grid_type = "ldp"              # Radial grid packing (sin²: packs core+edge)
psilow = 1e-4                  # Lower limit of normalized poloidal flux
psihigh = 0.995                # Upper limit of normalized poloidal flux
mpsi = 256                     # Fixed radial grid
mtheta = 256                   # Number of poloidal grid points
newq0 = 0                      # Override for on-axis safety factor (0 = use input value)
etol = 1e-10                   # Error tolerance for equilibrium solver
force_termination = false      # Terminate after equilibrium setup (skip stability calculations)

[Wall]
shape = "nowall"               # Free-boundary (no conducting wall)

[ForceFreeStates]
local_stability_flag = false   # Skip local Mercier/ballooning (not needed for tracing)
mat_flag = true                # Construct coefficient matrices for diagnostic purposes
ode_flag = true                # Integrate ODEs for stability of the internal long-wavelength mode
vac_flag = true                # Compute plasma, vacuum, and total energies for free-boundary modes

qlow = 1.02                    # Integration initiated at q determined by min(q0, qlow)
qhigh = 1e3                    # Integration terminated at q limit determined by min(qa, qhigh)
sing_start = 0                 # Start integration at the sing_start'th rational from the axis

nn_low = 1                     # Smallest toroidal mode number to include
nn_high = 1                    # Largest toroidal mode number to include
delta_mlow = 8                 # Expands lower bound of Fourier harmonics
delta_mhigh = 8                # Expands upper bound of Fourier harmonics
mthvac = 512                   # Points used in splines over poloidal angle at the plasma-vacuum interface

kinetic_source = "fixed"       # Kinetic matrix source: "fixed" test matrices or "calculated"
kinetic_factor = 0.0           # Scaling of kinetic matrices (0 = ideal path)
eulerlagrange_tolerance = 1e-10 # Relative tolerance for ODE integration of Euler-Lagrange equations
singfac_min = 1e-4             # Fractional distance from rational q at which ideal jump enforced

use_parallel = true            # Run parallel FM-propagator BVP path (unlocks singular/delta_prime_matrix)
parallel_threads = 2           # BVP thread cap
populate_dense_xi = true       # Dense ξ storage — REQUIRED with a [PerturbedEquilibrium] section
set_psilim_via_dmlim = true    # Truncate at (last_rational_q + dmlim)/n (diverted equilibria)
dmlim = 0.2                    # Truncation offset

[ForcingTerms]
forcing_data_format = "coil"   # Biot-Savart from 3D coil wires
machine = "d3d"                # Geometry prefix; resolves to bundled coil_geometries/d3d_*.dat
mtheta_coil = 480              # Poloidal grid for boundary B·n̂ evaluation
nzeta_coil = 40                # Toroidal grid

# Headline case: pure n=2 phasing on both I-coil arrays → dominant (4,2) resonance at q=2.
# The n=2 six-coil pattern is cos(2·60°·j) = [1, -0.5, -0.5, 1, -0.5, -0.5], scaled to 3 kA.
[[ForcingTerms.coil_set]]
name = "iu"                    # DIII-D I-coil upper (6 coils)
currents = [5000.0, 2500.0, -2500.0, -5000.0, -2500.0, 2500.0]

[[ForcingTerms.coil_set]]
name = "il"                    # DIII-D I-coil lower (6 coils)
currents = [5000.0, 2500.0, -2500.0, -5000.0, -2500.0, 2500.0]

[PerturbedEquilibrium]
fixed_boundary = false         # Use fixed boundary conditions
output_eigenmodes = true       # Output eigenmode fields as b-fields
compute_response = true        # Compute plasma response to forcing
compute_singular_coupling = true # Compute singular layer coupling metrics
verbose = true                 # Enable verbose logging
write_outputs_to_HDF5 = true   # Write perturbed equilibrium outputs to HDF5
reg_spot = 0.05                # Regularization width for singular surfaces (0 = disabled)

# Vacuum field-line tracing zoomed on the q=2 surface. flux_n_max=3 keeps the n=1,2,3
# harmonics of the coil field so competing (2,1) and (4,2) resonances both appear.
[FieldLineTracing]
tracing_coords = "flux"        # Integration coords: "flux" (interior) or "real" ((R,Z,φ))
tracing_field = "vacuum"       # Perturbation source: "total", "vacuum", or "plasma"
flux_n_max = 3                 # Highest toroidal harmonic in the vacuum flux drive
n_lines = 200                  # Number of field lines launched
psi_start = 0.42               # Innermost launch surface (brackets q=2 at ψ_N ≈ 0.518)
psi_end = 0.62                 # Outermost launch surface
n_transits = 500               # Toroidal transits integrated per field line
phi_planes = [0.0]             # Toroidal angle(s) of the Poincaré section [rad]
tol = 1e-7                     # Relative ODE tolerance
compute_connection_length = false # Skip connection-length map
compute_footprints = false     # Skip footprints (no wall)
compute_island_width = true    # Auto-detect island half-widths and Chirikov overlap
write_outputs_to_HDF5 = true   # Append tracing results to the HDF5 output
verbose = true                 # Verbose progress logging
