# a10 kinetic-DCON example — Julia mirror of Fortran GPEC a10_kinetic_example.
#
# Source namelists: ~/Code/gpec/docs/examples/a10_kinetic_example/{dcon.in,equil.in,pentrc.in}
# Shared inputs:    ~/Code/gpec/docs/examples/a10_ideal_example/
#
# This example depends on the user's local Fortran GPEC checkout at ~/Code/gpec
# for the g-file and kinetic profile (a10_prof1.txt). Both are referenced by
# absolute path so no inputs are duplicated into JPEC_ode. Adjust the paths
# if your Fortran GPEC copy lives elsewhere.
#
# Term-by-term Fortran↔Julia mapping: see memory/project_a10_kinetic_settings.md
# Reference Fortran run: mpsi=16 → kinetic DCON in ~48 s on a laptop.

[Equilibrium]
eq_filename = "/Users/nlogan/Code/gpec/docs/examples/a10_ideal_example/fix_a100_k10_q2_bn010_prof1"
eq_type = "efit"
jac_type = "hamada"
power_bp = 0
power_b = 0
power_r = 0
grid_type = "ldp"               # Fortran equil.in: grid_type="ldp"
psilow = 1e-3
psihigh = 0.99                  # Fortran: psihigh=0.99
mpsi = 16                       # Fortran: mpsi=16 (fast-iteration setting)
mtheta = 256
newq0 = 0
etol = 1e-7

[Wall]
shape = "nowall"

[ForceFreeStates]
bal_flag = false
mat_flag = true
ode_flag = true
vac_flag = true
mer_flag = true

# sas_flag=f in Fortran → no truncation via dmlim; Julia mirrors with
# set_psilim_via_dmlim=false and psiedge=1.0 (full integration to psihigh).
set_psilim_via_dmlim = false
psiedge = 1.0
qlow = 1.02
qhigh = 1e3
sing_start = 0

nn_low = 1
nn_high = 1
delta_mlow = 6                  # Fortran dcon.in: delta_mlow=6
delta_mhigh = 6                 # Fortran dcon.in: delta_mhigh=6
mthvac = 512
thmax0 = 1

kinetic_source = "calculated"   # Fortran kin_flag=t
kinetic_factor = 1.0            # Fortran kinfac1=kinfac2=1.0
eulerlagrange_tolerance = 1e-7
singfac_min = 1e-4
ucrit = 1e4
write_outputs_to_HDF5 = true
force_termination = true        # Stop after FFS — kinetic DCON eigenvalues are what we benchmark

[KineticForces]
kinetic_file = "/Users/nlogan/Code/gpec/docs/examples/a10_ideal_example/a10_prof1.txt"
nn = 1
nl = 6                          # Fortran pentrc.in: nl=6
zi = 1
mi = 2
zimp = 6
mimp = 12
electron = false                # Fortran: electron_flag=f (ion-only)
nutype = "harmonic"             # Fortran: nutype="harmonic"
f0type = "maxwellian"           # Fortran: f0type="maxwellian"
# Fortran pentrc.in tolerances
atol_xlmda = 1e-9
rtol_xlmda = 1e-5
atol_psi = 1e-9
rtol_psi = 1e-4
