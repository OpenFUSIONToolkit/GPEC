# TJ-analytic large-aspect-ratio equilibrium (q₀ = 1.6, q_a = 3.2, β_N = 0.42) with the 2/1 and 3/1 surfaces,
# stable at n = 1 with no wall (et[1] = +0.435), so a perturbed equilibrium can run without one.
# Adds a [KineticForces] section, so after the plasma response is computed the neoclassical toroidal
# viscosity torque is integrated over ψ as a post-processing diagnostic (adaptive quadrature paneled at
# the rational surfaces). The kinetic profiles (kinetic.dat) are consistent with this equilibrium's pressure.

[Run]
verbose = true                          # Log each stage's progress

[Equilibrium]
kinetic_file = "kinetic.dat"            # Kinetic-profile file (HDF5 GPEC kinetic schema or 6-column ASCII), read once into the equilibrium
jac_type = "hamada"                     # Coordinate system (hamada, pest, boozer, equal_arc, park, custom)
grid_type = "core_edge_packed"          # Radial grid packing type
psilow = 0.01                           # Lower limit of normalized poloidal flux
psihigh = 0.99                          # Upper limit of normalized poloidal flux; et[1] depends on it (+0.502 at 0.995), so it is pinned
mpsi = 128                              # Number of radial grid intervals (0 = two-pass auto grid from psi_accuracy)
mtheta = 256                            # Number of poloidal grid points

[ForcingTerms]
forcing_data_file = "forcing.dat"       # Manual mode table (n, m, amplitude_real, amplitude_imag)
forcing_data_format = "ascii"           # Format: "ascii", "hdf5", or "coil" (Biot-Savart from 3D wires)

[PerturbedEquilibrium]
compute_singular_coupling = true        # Compute singular layer coupling metrics
regularization_width = 0.05             # Regularization width for singular surfaces (0 = disabled)

[ForceFreeStates]
vac_flag = true                         # Compute plasma, vacuum, and total energies for free-boundary modes
qlow = 1.02                             # Integration initiated at q determined by min(q0, qlow)
qhigh = 1e3                             # Integration terminated at q limit determined by min(qa, qhigh)
nn = 1                                  # Toroidal mode number, or consecutive numbers as a list
delta_mlow = 8                          # Expands lower bound of Fourier harmonics
delta_mhigh = 8                         # Expands upper bound of Fourier harmonics
mtheta_vacuum = 960                     # Number of points used in splines over poloidal angle at the plasma-vacuum interface
singfac_min = 1e-6                      # Fractional distance from rational q at which ideal jump enforced
integrator = "Forward"                  # Integration formalism, whose numerical settings are its own section: "Forward" (dense ξ, needed for [PerturbedEquilibrium]/kinetic), "Riccati" (chunked propagator BVP, unlocks the singular-surface Δ′ matrix), or "Galerkin" (outer-region singular Galerkin Δ′)
truncate_at_rational_offset = false     # Truncate integration at (last_rational_q + rational_offset_fraction)/n; false for analytic equilibria

# Numerical settings of the forward integrator
[Forward]
eulerlagrange_tolerance = 1e-9          # Relative tolerance for ODE integration of Euler-Lagrange equations

# TJ-analytic equilibrium parameters (cf. R. Fitzpatrick, TJ code, https://github.com/rfitzp/TJ); this section selects the
# equilibrium. Keep p0 at or below 0.2: et[1] stays near +0.42 up to there and is not monotonic above it.
[TJAnalytic]
r0               = 10.0                 # Major radius R₀ [m] (centerline radius of the magnetic axis)
a                = 1.0                  # Minor radius a [m] (plasma half-width at the midplane; here ε = 0.1)
q0               = 1.6                  # On-axis safety factor q(r=0)
qa               = 3.2                  # Edge safety factor q(r=a)
p0               = 0.1                  # Normalized on-axis pressure
pressure_peaking = 2.0                  # Pressure-profile peaking exponent in p₂(r) = p0·(1−r²)^μ
B0               = 1.0                  # On-axis toroidal field [T]
ma               = 128                  # TJ-analytic internal radial grid resolution (shape-ODE nodes)
mtheta           = 128                  # TJ-analytic internal poloidal grid resolution (θ-spline nodes)

[KineticForces]
fcgl_flag = true                        # Fluid Chew–Goldberger–Low energy (l = 0 fluid limit) alongside the default fgar method
axis_validity_suppression = true        # Suppress kinetic terms inside the near-axis orbit-width validity limit
