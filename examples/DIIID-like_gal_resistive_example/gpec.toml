# DIII-D-like H-mode resistive-MHD example: outer-region singular Galerkin Δ′ solve.
# n=1 tearing stability on the bundled geqdsk: the gal solver computes the Δ′
# matching matrix (PEST-3 convention) plus rpec coil-response columns (delta_coil).
# The core_edge_packed radial grid is densest at the axis and edge; psihigh = 0.993
# stays clear of the separatrix. No forcing and no PerturbedEquilibrium stage —
# see the sibling DIIID-like_gal_resistive_pe_example for the coil-driven continuation.
[Run]
verbose = true                 # Log each stage's progress

[Equilibrium]
eq_filename = "TkMkr_D3Dlike_Hmode.geqdsk" # Path to equilibrium file
eq_type = "efit"               # Type of the input 2D equilibrium file
jac_type = "hamada"            # Coordinate system (hamada, pest, boozer, equal_arc, park, custom)
grid_type = "core_edge_packed" # Radial grid packing type (core_edge_packed = sin² spacing, dense at axis and edge)
psilow = 1e-4                  # Lower limit of normalized flux coordinate
psihigh = 0.993                # Upper limit of normalized flux coordinate (0.993 stays clear of the separatrix; truncating at ≳0.998 is numerically unreasonable here)
mpsi = 128                     # Number of radial grid intervals (0 = two-pass auto grid from psi_accuracy)
psi_accuracy = 0.001           # Target relative accuracy of splined profile derivatives for the auto grid
mtheta = 256                   # Number of poloidal grid points
newq0 = 0                      # Target on-axis safety factor q(0) (0 = use input value, -1 = flip axis extrapolation)
flux_surface_rtol = 1e-10      # Relative tolerance of the ODE solves that trace each flux surface

# Presence runs the LocalStability stage (Mercier D_I, resistive D_R, ballooning Δ', first α boundary); keys are the LocalStabilityProblem settings, numerics in [Ballooning]
[LocalStability]
theta_k = 0.0                 # Ballooning angle θ_k, used by both the profile scan and the α-boundary scan
alpha_boundary_scan = true    # Run the first ballooning α-boundary scan (a root find per ψ surface)

# Numerical settings of the ballooning scans
[Ballooning]
ode_tol = 1e-8                # Relative and absolute tolerance of the ballooning ODE integration behind Δ'
n_scan = 24                   # Resolution of the α scan for the first boundary
max_alpha_scale = 8.0         # Upper end of the α search, as a multiple of the experimental α
alpha_tol = 1e-3              # Bisection tolerance of the critical α, in the same multiples
psi_window = [0.1, 0.99]      # ψ_N range of the α scan; surfaces outside it are NaN

[ForceFreeStates]
vac_flag = true                # Compute plasma, vacuum, and total energies for free-boundary modes

dW_edge_scan_start = 0.99      # Edge dW(ψ) diagnostic scan band [dW_edge_scan_start, psilim]; set ≥ psilim to disable
qlow = 1.02                    # Integration initiated at q determined by min(q0, qlow)...
qhigh = 1e3                    # Integration terminated at q limit determined by min(qa, qhigh)...

nn = 1                         # Toroidal mode number, or consecutive numbers as a list
delta_mlow = 8                 # Expands lower bound of Fourier harmonics
delta_mhigh = 4                # Expands upper bound of Fourier harmonics
mtheta_vacuum = 512            # Number of points used in splines over poloidal angle at plasma-vacuum interface.

singfac_min = 1e-4             # Fractional distance from rational q at which ideal jump enforced

# Integrator selection and domain truncation (see ForceFreeStatesControl docstring for details)
integrator = "Galerkin" # Integration formalism, whose numerical settings are its own section: "Forward" (dense ξ, needed for [PerturbedEquilibrium]/kinetic), "Riccati" (chunked propagator BVP, unlocks the singular-surface Δ′ matrix), or "Galerkin" (outer-region singular Galerkin Δ′)
truncate_at_rational_offset = false # Keep psilim at psihigh (do not truncate at last_rational_q + rational_offset_fraction)
rational_offset_fraction = 0.2 # Truncate integration at (last_rational_q + rational_offset_fraction) / n (only used when truncate_at_rational_offset = true)

frobenius_order = 6 # Order of singular layer (Frobenius) expansion at rational surfaces

# Outer-region singular Galerkin Δ′ solver with rpec coil columns.
# This case exercises the gal solve AND the rpec coil/edge path (delta_coil) for regression tracking.
[Galerkin]
nx                     = 256   # Hermite-cubic elements per interval between singular surfaces
nq                     = 6     # Gauss-Lobatto quadrature order per element
pfac                   = 0.03  # Grid packing ratio toward singular surfaces (smaller = tighter packing)
dx0                    = 5e-4  # Resonant-element integration truncation distance from the rational (× 1/|n q'|)
dx1                    = 1e-3  # Resonant-element size (× 1/|n q'|)
dx2                    = 1e-3  # Extension-element size (× 1/|n q'|)
cutoff                 = 10    # Number of elements carrying the large (driving) solution as a source term
tol                    = 1e-10 # Resonant-cell adaptive-quadrature (QuadGK) tolerance
gnstep                 = 5000  # Maximum resonant-integration steps
dx1dx2_flag            = true  # Enable the special dx1/dx2 element sizing for resonant/extension cells
frobenius_order_ceiling = true  # Auto-raise the series order by ceil(2·Re(α)) on high-Mercier-index surfaces
rpec_flag              = true  # Append mpert coil-response columns (unit edge sources) to the solve → delta_coil block

# Driven inner-layer matching on the finished solve. Per-surface resistive inputs (core→edge) for a DIII-D-like case:
# η=8e-8, ρ=3.3e-7 kg/m³ (ni≈1e20 m^-3), rotation=1 Hz, Γ=5/3. 4 surfaces.
[Match]
eta                    = [8e-8, 8e-8, 8e-8, 8e-8]          # Per-surface resistivity η (core→edge)
rho                    = [3.3e-7, 3.3e-7, 3.3e-7, 3.3e-7]  # Per-surface mass density ρ [kg/m³] (core→edge)
rotation               = [1.0, 1.0, 1.0, 1.0]             # Per-surface rotation frequency f [Hz] (core→edge); forced eigenvalue γ_s = 2πi·n·f
gamma                  = 1.6666666666666667               # Ratio of specific heats Γ for the resistive-layer coefficients (5/3)
