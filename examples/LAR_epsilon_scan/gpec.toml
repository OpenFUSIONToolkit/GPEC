# gpec.toml for LAR epsilon (inverse aspect ratio) scan
#
# Matches Fortran STRIDE settings from GPEC/docs/scans/inputs/epsilon_scan/
# Used with TJ benchmark geqdsk equilibria (TJ_epsilon_scan_*.geqdsk).
#
# eq_filename is a PLACEHOLDER — the scan runner overwrites it per point.

[Equilibrium]
eq_type = "efit"
eq_filename = "PLACEHOLDER"
jac_type = "hamada"
grid_type = "ldp"
psilow = 0.01
psihigh = 0.995
mpsi = 128
mtheta = 256

[Wall]
shape = "conformal"
a = 20              # Matches Fortran &shape a=20 (effectively nowall — wall at 20x minor radius)
aw = 0.1            # Matches Fortran &vacdat aw=0.1 (not used for ishape=6 wall distance)

[ForceFreeStates]
bal_flag = false               # Disabled: PeriodicBC error in Bal.jl with LAR geqdsk equilibria
mat_flag = true
ode_flag = true
vac_flag = true
mer_flag = true

qlow = 1.02
qhigh = 3.6
sing_start = 0

nn_low = 1
nn_high = 1
delta_mlow = 8
delta_mhigh = 8
delta_mband = 0
mthvac = 960
thmax0 = 1

eulerlagrange_tolerance = 1e-12
singfac_min = 1e-4
ucrit = 1e4
sing_order = 6


use_parallel = true
force_termination = true
write_outputs_to_HDF5 = true
HDF5_filename = "gpec.h5"
save_interval = 3
