# DIII-D-like H-mode equilibrium — n=1 ideal stability + perturbed equilibrium.
# Free-boundary (nowall) external-kink analysis with DIII-D C-coil forcing applied
# via Biot-Savart from 3D coil wires. This is the canonical Δ'-matrix regression
# fixture (stable, clean BVP Δ') and the default benchmark case.

[Equilibrium]
eq_filename = "TkMkr_D3Dlike_Hmode.geqdsk" # Path to equilibrium file
kinetic_file = "TkMkr_D3Dlike_Hmode_kinetic.h5" # Kinetic-profile file (HDF5 GPEC kinetic schema or 6-column ASCII), read once into the equilibrium
eq_type = "efit"               # Type of the input 2D equilibrium file
jac_type = "hamada"            # Coordinate system (hamada, pest, boozer, equal_arc, park, custom)
grid_type = "auto"             # Radial grid packing type ("auto" = two-pass measured-curvature grid)
psilow = 1e-4                  # Lower limit of normalized poloidal flux
psihigh = 0.995                # Upper limit of normalized poloidal flux (captures q=6 at this Ip)
mpsi = 0                       # Number of radial grid intervals (0 = two-pass auto grid from psi_accuracy)
psi_accuracy = 0.001           # Target relative accuracy of splined profile derivatives for the auto grid
mtheta = 256                   # Number of poloidal grid points
newq0 = 0                      # Target on-axis safety factor q(0) (0 = use input value, -1 = flip axis extrapolation)
flux_surface_rtol = 1e-10      # Relative tolerance of the ODE solves that trace each flux surface
force_termination = false      # Terminate after equilibrium setup (skip stability calculations)

# Presence runs the LocalStability stage (Mercier D_I, resistive D_R, ballooning Δ', first α boundary); keys are the Ballooning keywords
[LocalStability]
theta_k = 0.0                 # Ballooning angle θ_k, used by both the profile scan and the α-boundary scan
ode_tol = 1e-8                # Relative and absolute tolerance of the ballooning ODE integration behind Δ'
alpha_boundary_scan = true    # Run the first ballooning α-boundary scan (a root find per ψ surface)
n_scan = 24                   # Resolution of the α scan for the first boundary
max_alpha_scale = 8.0         # Upper end of the α search, as a multiple of the experimental α
alpha_tol = 1e-3              # Bisection tolerance of the critical α, in the same multiples
psi_window = [0.1, 0.99]      # ψ_N range of the α scan; surfaces outside it are NaN
verbose = true                # Print progress and per-surface α-scan failures

[ForceFreeStates]
vac_flag = true                # Compute plasma, vacuum, and total energies for free-boundary modes

dW_edge_scan_start = 0.99      # Edge dW(ψ) diagnostic scan band [dW_edge_scan_start, psilim]; set ≥ psilim to disable
qlow = 1.02                    # Integration initiated at q determined by min(q0, qlow)
qhigh = 1e3                    # Integration terminated at q limit determined by min(qa, qhigh)
sing_start = 0                 # Start integration at the sing_start'th rational from the axis (psilow)

nn_low = 1                     # Smallest toroidal mode number to include
nn_high = 1                    # Largest toroidal mode number to include
delta_mlow = 8                 # Expands lower bound of Fourier harmonics
delta_mhigh = 8                # Expands upper bound of Fourier harmonics
mtheta_vacuum = 512            # Number of points used in splines over poloidal angle at the plasma-vacuum interface

kinetic_source = "fixed"       # Kinetic matrix source: "fixed" test matrices, or "calculated" from the kinetic NTV model
kinetic_factor = 0.0           # Scaling of kinetic matrices (0 = ideal path; >0 enables kinetic mode)
eulerlagrange_tolerance = 1e-10 # Relative tolerance for ODE integration of Euler-Lagrange equations
save_interval = 1              # Save every Nth ODE step (1=all). Always saves near rational surfaces.
singfac_min = 1e-6             # Fractional distance from rational q at which ideal jump enforced
renorm_threshold = 1e3         # Column-norm threshold that triggers solution renormalization

# Integrator selection and domain truncation (see ForceFreeStatesControl docstring for details)
integrator            = "forward" # Integration formalism: "forward" (dense ξ, needed for [PerturbedEquilibrium]/kinetic), "riccati" (chunked propagator BVP, unlocks the singular-surface Δ′ matrix), or "galerkin" (RDCON outer-region singular Galerkin Δ′, with the optional RPEC inner-layer match)
truncate_at_rational_offset = true # Truncate at (last_rational_q + rational_offset_fraction)/n — TRUE for diverted equilibria (q → ∞ at separatrix)
rational_offset_fraction = 0.2 # Truncate integration at (last_rational_q + rational_offset_fraction)/n (used when truncate_at_rational_offset = true)

[ForcingTerms]
forcing_data_format = "coil"            # Format: "ascii", "hdf5", or "coil" (Biot-Savart from 3D wires)
machine = "d3d"                         # Geometry prefix; resolves to bundled coil_geometries/d3d_*.dat
mtheta_coil = 480                       # Poloidal grid for boundary B·n̂ evaluation
nzeta_coil = 32                         # Toroidal grid (0 = auto = 32·n)

[[ForcingTerms.coil_set]]
name = "c"                              # Coil set; resolves to coil_geometries/d3d_c.dat (DIII-D C-coil, 6 coils)
currents = [1000.0, 500.0, -500.0, -1000.0, -500.0, 500.0]  # n=1 cosine phasing, 1 kA peak [A]

[PerturbedEquilibrium]
compute_singular_coupling = true        # Compute singular layer coupling metrics
verbose = true                          # Enable verbose logging
write_outputs_to_HDF5 = true            # Write perturbed equilibrium outputs to HDF5
regularization_width = 0.05             # Regularization width for singular surfaces (0 = disabled)

[ErrorFields]
fd_step_shift_m = 1e-3                  # Central-difference step for the rigid shifts [m]
fd_step_tilt_deg = 0.1                  # Central-difference step for the rigid tilts [degrees]
rotation_center = "conductor"           # Tilt pivot: each conductor's own centre ("conductor") or the whole set's ("set")
write_outputs_to_HDF5 = true            # Write ErrorFields/CoilSensitivities/ to the output file
verbose = true                          # Log per-coil-set progress and linearity diagnostics

[KineticForces]
nn = 1                                  # Toroidal mode number (matches nn_low/nn_high)
bounce_harmonic_max = 6                 # Bounce harmonics retained
ion_charge = 1                          # Main-ion charge (deuterium)
ion_mass = 2                            # Main-ion mass [proton masses]
impurity_charge = 6                     # Impurity charge (carbon)
impurity_mass = 12                      # Impurity mass [proton masses]
electron = false                        # Ion-only NTV
nutype = "harmonic"                     # Collision operator
f0type = "maxwellian"                   # Equilibrium distribution
atol_pitch = 1e-9                       # Absolute tolerance for the pitch integration (median-normalized kernel)
axis_validity_suppression = true        # Suppress kinetic terms inside the near-axis orbit-width validity limit
write_outputs_to_HDF5 = true            # Write outputs to the HDF5 file
verbose = true                          # Enable verbose logging
