# DIII-D-like SLAYER tearing-mode growth-rate example.
# Reuses the equilibrium and H-mode kinetic profiles of the sibling
# DIIID-like_ideal_example (geqdsk referenced by relative path; not
# duplicated). Runs equilibrium + ForceFreeStates + SLAYER and skips
# PerturbedEquilibrium (ForceFreeStates.force_termination = true).

[Equilibrium]
eq_filename = "../DIIID-like_ideal_example/TkMkr_D3Dlike_Hmode.geqdsk" # Path to equilibrium file
eq_type = "efit"               # Type of the input 2D equilibrium file
jac_type = "hamada"            # Coordinate system (hamada, pest, boozer, equal_arc)
grid_type = "log_asymptotic"   # Radial grid packing type
psilow = 1e-4                  # Lower limit of normalized flux coordinate
psihigh = 0.9995               # Upper limit of normalized flux coordinate
mpsi = 0                       # Number of radial grid points (0 = auto-compute from psi_accuracy)
psi_accuracy = 0.001           # Target absolute error in q for auto-mpsi
mtheta = 256                   # Number of poloidal grid points
newq0 = 0                      # Target on-axis safety factor q(0) (0 = use input value, -1 = flip axis extrapolation)
flux_surface_rtol = 1e-10      # Relative tolerance of the ODE solves that trace each flux surface
force_termination = false      # Terminate after equilibrium setup (skip stability calculations)

[Wall]
shape = "nowall"               # Wall shape (nowall, conformal, elliptical, dee, mod_dee, filepath)
standoff_fraction = 0.2415     # Wall standoff in plasma minor radii (conformal, dee)
half_thickness = 0.05          # Half-thickness parameter for Dee-shaped walls
elongation = 1.5               # Elongation parameter for wall shapes
center_offset = 0              # Offset of wall center from major radius
triangularity = 0.5            # Triangularity parameter for wall shapes
corner_sharpness = 0.05        # Sharpness of wall corners (try 0.05 as initial value)
equal_arc_wall = true          # Equal arc length distribution of nodes on wall

# Presence runs the LocalStability stage (Mercier D_I, resistive D_R, ballooning Δ', first α boundary); keys are the Ballooning keywords
[LocalStability]
theta_k = 0.0                 # Ballooning angle θ_k, used by both the profile scan and the α-boundary scan
ode_tol = 1e-8                # Relative and absolute tolerance of the ballooning ODE integration behind Δ'
alpha_boundary_scan = true    # Run the first ballooning α-boundary scan (a root find per ψ surface)
n_scan = 24                   # Resolution of the α scan for the first boundary
max_alpha_scale = 8.0         # Upper end of the α search, as a multiple of the experimental α
alpha_tol = 1e-3              # Bisection tolerance of the critical α, in the same multiples
psi_window = [0.1, 0.99]      # ψ_N range of the α scan; surfaces outside it are NaN
verbose = true                # Print progress and per-surface α-scan failures

[ForceFreeStates]
force_termination = true       # Run FFS + SLAYER, skip PerturbedEquilibrium
vac_flag = true                # Compute plasma, vacuum, and total energies for free-boundary modes

dW_edge_scan_start = 0.99      # Edge dW(ψ) diagnostic scan band [dW_edge_scan_start, psilim]; set ≥ psilim to disable
qlow = 1.02                    # Integration initiated at q determined by min(q0, qlow)...
qhigh = 1e3                    # Integration terminated at q limit determined by min(qa, qhigh)...
sing_start = 0                 # Start integration at the sing_start'th rational from the axis (psilow)

nn_low = 1                     # Smallest toroidal mode number to include
nn_high = 1                    # Largest toroidal mode number to include
delta_mlow = 8                 # Expands lower bound of Fourier harmonics
delta_mhigh = 8                # Expands upper bound of Fourier harmonics
mtheta_vacuum = 512            # Number of points used in splines over poloidal angle at the plasma-vacuum interface

kinetic_source = "fixed"       # Kinetic matrix source: "fixed" test matrices, or "calculated" from the kinetic NTV model
kinetic_factor = 0.0           # Scaling of kinetic matrices (0 = ideal path; >0 enables kinetic mode)
eulerlagrange_tolerance = 1e-10# Relative tolerance for ODE integration of Euler-Lagrange equations
save_interval = 1              # Save every Nth ODE step (1=all). Always saves near rational surfaces.
singfac_min = 1e-4             # Fractional distance from rational q at which ideal jump enforced
renorm_threshold = 1e3         # Column-norm threshold that triggers solution renormalization

# Integrator selection and domain truncation (see ForceFreeStatesControl docstring for details)
integrator            = "riccati" # Integration formalism: "forward" (dense ξ, needed for [PerturbedEquilibrium]/kinetic), "riccati" (chunked propagator BVP, unlocks the singular-surface Δ′ matrix), or "galerkin" (RDCON outer-region singular Galerkin Δ′, with the optional RPEC inner-layer match)
truncate_at_rational_offset = true # TRUE for diverted geqdsks — q → ∞ at separatrix, so rational_offset_fraction truncation avoids the δW kink instability at negligible domain cost
rational_offset_fraction = 0.2 # Truncate integration at (last_rational_q + rational_offset_fraction) / n

[SLAYER]
# SLAYER tearing-mode growth-rate analysis on the DIII-D-like H-mode equilibrium.
# Runs in the force_termination path (PE skipped). Kinetic profiles (incl. the
# χ⊥/χ_φ heat/momentum diffusivities) are read from the standardized HDF5
# kinetic file shared with the kinetic/NTV physics. Per-surface (uncoupled)
# analysis: track the 2/1, 3/1, and 4/1 (the headline is the unstable 2/1).
# The 5/1 and 6/1 sit near the edge (ψ_N ≥ 0.97), far from the core where the
# slab-layer approximation holds; their Δ' are excessively large and likely
# invalid, no Re/Im contour crossing polishes to a true zero, and the validity
# gate correctly reports them as no_root rather than a spurious growth rate.
enabled                 = true       # Run the SLAYER tearing-mode analysis
inner_model             = "slayer_fitzpatrick" # Inner-layer Δ(Q) model: only "slayer_fitzpatrick" (GGJ tearing growth rates are not implemented)
scan_mode               = "amr"      # Q-plane scan strategy: "amr" (adaptive refinement) or "brute_force"
coupling_mode           = "uncoupled" # "uncoupled" (per-surface) or "coupled" (multi-surface determinant)
D_c_type                = "none"     # Critical-Δ offset selector: "none", "lar", "fitzpatrick", or "toroidal"
ion_mass                = 2.0        # Ion mass in proton-mass units (2.0 = deuterium)
zeff                    = 1.0        # fallback only; Z_eff(ψ) comes from the kinetic file (its zeff profile, else n_i/n_e with zimp)
impurity_charge         = 6.0        # Impurity charge closing quasi-neutrality when Z_eff(ψ) is derived from n_i/n_e (6.0 = carbon)
chi_perp                = 1.0       # fallback only; the kinetic file supplies χ⊥(ψ)
chi_tor                 = 1.0       # fallback only; the kinetic file supplies χ_φ(ψ)
# omega_E_kHz           = {"2/1" = 0.0, "3/1" = 3.0} # override of the E×B rotation Ω_E/2π per unit n [kHz], keyed by m/n; unlisted surfaces use the kinetic file
pole_threshold_adaptive = true       # SLAYER |Δ| spans many orders; adapt to 10·median(|Δ|)
filter_above_poles      = true       # Discard roots above the highest pole γ
filter_outside_re       = true       # Condition the above-pole filter on the +γ step exiting the Re(Δ)=0 contour loop
polish_roots            = true       # refine each root to the true zero; enables the validity gate
store_scan              = false      # per-surface scans omitted from HDF5 (uncoupled has one per surface)
# Standardized kinetic-profile file (GPEC HDF5 kinetic schema), shared with the
# sibling ideal example; carries n_e, T_e, T_i, omega_E, chi_e (χ⊥), chi_phi (χ_φ).
profile_file = "../DIIID-like_ideal_example/TkMkr_D3Dlike_Hmode_kinetic.h5" # Kinetic-profile file (relative to the run dir), required when SLAYER is enabled

[SLAYER.scan_grid]
Q_re_range = [-2.0, 2.0]       # Scan box in the normalized Q plane, Re(Q) axis
Q_im_range = [-0.5, 3.0]       # Scan box in the normalized Q plane, Im(Q) axis
nre        = 41                # Grid resolution along the Re(Q) axis
nim        = 31                # Grid resolution along the Im(Q) axis

[SLAYER.CriticalResonantField]
# Critical resonant field b_r/B_φ for error-field penetration at each SLAYER surface, from the
# Cole-Fitzpatrick 2006 torque balance with P = P_tor of each layer and Q0 = τ_k·n·Ω_E, so it
# needs the kinetic file's omega_E (or omega_E_kHz). Qmin/Qmax may be set to override the
# per-surface scan window derived from Q0, Q_e and Q_i.
enabled    = true      # run the analysis after SLAYER
n          = 2000      # number of Q samples per surface
pole_width = 0.02      # half-width in Q around Q_e, Q_i within which a maximum is discarded as pole-dominated
store_scan = false     # write the per-surface Q, torque balance and Δ samples to gpec.h5
