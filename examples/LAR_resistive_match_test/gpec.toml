# LAR (TJ-analytic) resistive-match test case for the STRIDE/Riccati path.
#
# A genuinely different equilibrium from the DIII-D-like validation: large-aspect-ratio,
# analytic TJ model (Fitzpatrick), ε = a/R₀ = 0.2, n = 1. Purpose: exercise resonant_match_rpec
# on a new equilibrium and check it is internally self-consistent (residual ~1e-16, ideal-limit
# cout = 0, self-convergence in gal_sing_order). NOTE: the current branch has no galerkin match
# path, so a galerkin head-to-head requires the STRIDE-deltacoil branch (commit this work first).
#
# For n = 1 with q ∈ [1.5, 3.6] the rational surfaces are q = 2 and q = 3 → msing = 2, so the
# per-surface resistive arrays below have length 2 (core→edge).

[Equilibrium]
eq_type   = "tj_analytic"
jac_type  = "hamada"
grid_type = "ldp"
psilow    = 0.01
psihigh   = 0.995
mpsi      = 128
mtheta    = 512

[TJ_ANALYTIC_INPUT]
lar_r0 = 2.0
lar_a  = 0.4
qc     = 1.5
qa     = 3.6
pc     = 0.01
mu     = 2.0
B0     = 12.0
ma     = 128
mtau   = 128

[Wall]
shape = "conformal"
a     = 20

[ForceFreeStates]
HDF5_filename        = "gpec_stride_lar.h5"
local_stability_flag = true
mat_flag             = true
ode_flag             = true
vac_flag             = true

qlow        = 1.02
qhigh       = 3.6
sing_start  = 0
nn_low      = 1
nn_high     = 1
delta_mlow  = 8
delta_mhigh = 8
delta_mband = 0
mthvac      = 960
thmax0      = 1

eulerlagrange_tolerance = 1e-12
singfac_min             = 1e-4
ucrit                   = 1e4
sing_order              = 6
save_interval           = 3

use_parallel         = true
parallel_threads     = 2
populate_dense_xi    = false
truncate_at_dW_peak  = false
set_psilim_via_dmlim = false
dmlim                = 0.2
force_termination    = true
write_outputs_to_HDF5 = true

# Outer-region singular Galerkin Δ′ solve + rpec unit-edge columns (delta_coil), then the
# STRIDE outer↔inner resistive match (Wang 2020 Eq. 11).
gal_flag               = true
gal_solver             = "LU"
gal_nx                 = 256
gal_nq                 = 6
gal_pfac               = 0.03
gal_dx0                = 5e-4
gal_dx1                = 1e-3
gal_dx2                = 1e-3
gal_cutoff             = 10
gal_tol                = 1e-10
gal_gnstep             = 5000
gal_dx1dx2_flag        = true
gal_sing_order         = 6
gal_sing_order_ceiling = true
gal_rpec_flag          = true

# DRIVEN (RPEC) resistive match. 2 rational surfaces (q=2,3). Same nominal layer inputs as the
# DIII-D case: η=8e-8, ρ=3.3e-7 kg/m³, rotation=1 Hz, Γ=5/3.
gal_match_flag = true
gal_ideal_flag = false
gal_eta        = [8e-8, 8e-8]
gal_rho        = [3.3e-7, 3.3e-7]
gal_rotation   = [1.0, 1.0]
gal_gamma      = 1.6666666666666667
