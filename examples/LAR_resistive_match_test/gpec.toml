# LAR resistive-match test: large-aspect-ratio analytic TJ equilibrium, epsilon = a/R0 = 0.2, n = 1.
#
# A different equilibrium from the DIII-D-like validation case, used to check that the
# outer-region Galerkin Delta-prime solve and the driven (RPEC) outer-inner match stay self-consistent
# on a second geometry: matching residual near machine precision and convergence under frobenius_order
# refinement. For n = 1 with q in [1.5, 3.6] the rational surfaces are q = 2 and q = 3, so msing = 2
# and the per-surface resistive arrays below have length 2 (core to edge). This run terminates after
# the stability stage. The companion LAR_ideal_match_test case is the ideal-limit reference.

[Run]
output_file = "gpec_lar_resistive.h5"# HDF5 file every stage saves into, relative to this deck's directory
verbose = true                 # Log each stage's progress

[Equilibrium]
jac_type  = "hamada"           # Coordinate system (hamada, pest, boozer, equal_arc, park, custom)
grid_type = "core_edge_packed" # Radial grid packing type (core_edge_packed = sin² spacing, dense at axis and edge)
psilow    = 0.01               # Lower limit of normalized flux coordinate
psihigh   = 0.995              # Upper limit of normalized flux coordinate
mpsi      = 128                # Number of radial grid points (0 = auto-compute from psi_accuracy)
mtheta    = 512                # Number of poloidal grid points

[TJAnalytic]
r0               = 2.0         # Major radius R0 [m]
a                = 0.4         # Minor radius a [m] (epsilon = a/R0 = 0.2)
q0               = 1.5         # On-axis safety factor
qa               = 3.6         # Edge safety factor
p0               = 0.01        # Normalized on-axis pressure
pressure_peaking = 2.0         # Pressure peaking exponent: p2 = p0*(1-r^2)^pressure_peaking
B0               = 12.0        # On-axis toroidal field [T]
ma               = 128         # Radial grid points
mtheta           = 128         # Poloidal grid points

[Wall]
shape = "conformal"            # Wall shape (conformal, elliptical, dee, mod_dee, file)
standoff_fraction = 20         # Wall standoff in plasma minor radii

# Presence runs the LocalStability stage (Mercier D_I, resistive D_R, ballooning Δ', first α boundary); keys are the LocalStabilityProblem settings, numerics in [Ballooning]
[LocalStability]
theta_k = 0.0                 # Ballooning angle θ_k, used by both the profile scan and the α-boundary scan
alpha_boundary_scan = true    # Run the first ballooning α-boundary scan (a root find per ψ surface)

# Numerical settings of the ballooning scans
[Ballooning]
ode_tol = 1e-8                # Relative and absolute tolerance of the ballooning ODE integration behind Δ'
n_scan = 24                   # Resolution of the α scan for the first boundary
max_alpha_scale = 8.0         # Upper end of the α search, as a multiple of the experimental α
alpha_tol = 1e-3              # Bisection tolerance of the critical α, in the same multiples
psi_window = [0.1, 0.99]      # ψ_N range of the α scan; surfaces outside it are NaN

[ForceFreeStates]
vac_flag             = true    # Compute plasma, vacuum, and total energies for free-boundary modes

qlow        = 1.02             # Integration initiated at q determined by min(q0, qlow)
qhigh       = 3.6              # Integration terminated at q limit determined by min(qa, qhigh)
nn = 1                         # Toroidal mode number, or consecutive numbers as a list
delta_mlow  = 8                # Expands lower bound of Fourier harmonics
delta_mhigh = 8                # Expands upper bound of Fourier harmonics
mtheta_vacuum = 960            # Number of points used in splines over poloidal angle at plasma-vacuum interface

singfac_min             = 1e-4  # Fractional distance from rational q at which ideal jump enforced
frobenius_order         = 6     # Power-series order for the singular-surface asymptotics

integrator = "Galerkin" # Integration formalism, whose numerical settings are its own section: "Forward" (dense ξ, needed for [PerturbedEquilibrium]/kinetic), "Riccati" (chunked propagator BVP, unlocks the singular-surface Δ′ matrix), or "Galerkin" (outer-region singular Galerkin Δ′)
truncate_at_rational_offset = false # Keep psilim at psihigh (do not truncate at last_rational_q + rational_offset_fraction)
rational_offset_fraction = 0.2 # Truncate integration at (last_rational_q + rational_offset_fraction) / n (only used when truncate_at_rational_offset = true)

# Outer-region singular Galerkin Delta-prime solver with rpec coil columns.
[Galerkin]
nx                     = 256   # Hermite-cubic elements per interval between singular surfaces
nq                     = 6     # Gauss-Lobatto quadrature order per element
pfac                   = 0.03  # Grid packing ratio toward singular surfaces (smaller = tighter packing)
dx0                    = 5e-4  # Resonant-element integration truncation distance from the rational (times 1/|n q'|)
dx1                    = 1e-3  # Resonant-element size (times 1/|n q'|)
dx2                    = 1e-3  # Extension-element size (times 1/|n q'|)
cutoff                 = 10    # Number of elements carrying the large (driving) solution as a source term
tol                    = 1e-10 # Resonant-cell adaptive-quadrature (QuadGK) tolerance
gnstep                 = 5000  # Maximum resonant-integration steps
dx1dx2_flag            = true  # Enable the special dx1/dx2 element sizing for resonant/extension cells
frobenius_order_ceiling = true  # Auto-raise the series order by ceil(2*Re(alpha)) on high-Mercier-index surfaces
rpec_flag              = true  # Append mpert coil-response columns (unit edge sources) to the solve, giving the delta_coil block

# Driven inner-layer matching on the finished solve. Per-surface resistive inputs (core to edge) for the two
# rational surfaces q = 2 and q = 3: eta=8e-8, rho=3.3e-7 kg/m^3, rotation=1 Hz, Gamma=5/3.
[Match]
eta                    = [8e-8, 8e-8]      # Per-surface resistivity eta (core to edge)
rho                    = [3.3e-7, 3.3e-7]  # Per-surface mass density rho [kg/m^3] (core to edge)
rotation               = [1.0, 1.0]        # Per-surface rotation frequency f [Hz] (core to edge); forced eigenvalue gamma_s = 2*pi*i*n*f
gamma                  = 1.6666666666666667 # Ratio of specific heats Gamma for the resistive-layer coefficients (5/3)
