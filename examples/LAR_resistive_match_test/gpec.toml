# LAR resistive-match test: large-aspect-ratio analytic TJ equilibrium, epsilon = a/R0 = 0.2, n = 1.
#
# A different equilibrium from the DIII-D-like validation case, used to check that the
# outer-region Galerkin Delta-prime solve and the driven (RPEC) outer-inner match stay self-consistent
# on a second geometry: matching residual near machine precision and convergence under gal_sing_order
# refinement. For n = 1 with q in [1.5, 3.6] the rational surfaces are q = 2 and q = 3, so msing = 2
# and the per-surface resistive arrays below have length 2 (core to edge). This run terminates after
# the stability stage. The companion LAR_ideal_match_test case is the ideal-limit reference.

[Equilibrium]
eq_type   = "tj_analytic"      # Type of the input 2D equilibrium (analytic large-aspect-ratio model)
jac_type  = "hamada"           # Coordinate system (hamada, pest, boozer, equal_arc, park, custom)
grid_type = "ldp"              # Radial grid packing type (ldp = linear-derivative packing toward rationals)
psilow    = 0.01               # Lower limit of normalized flux coordinate
psihigh   = 0.995              # Upper limit of normalized flux coordinate
mpsi      = 128                # Number of radial grid points (0 = auto-compute from psi_accuracy)
mtheta    = 512                # Number of poloidal grid points

[TJ_ANALYTIC_INPUT]
lar_r0 = 2.0                   # Major radius R0 [m]
lar_a  = 0.4                   # Minor radius a [m] (epsilon = a/R0 = 0.2)
qc     = 1.5                   # On-axis safety factor
qa     = 3.6                   # Edge safety factor
pc     = 0.01                  # Normalized on-axis pressure
mu     = 2.0                   # Pressure peaking exponent: p2 = pc*(1-r^2)^mu
B0     = 12.0                  # On-axis toroidal field [T]
ma     = 128                   # Radial grid points
mtau   = 128                   # Poloidal grid points

[Wall]
shape = "conformal"            # Wall shape (nowall, conformal, elliptical, dee, mod_dee, filepath)
a     = 20                     # Distance from plasma (conformal) or shape parameter

[ForceFreeStates]
HDF5_filename        = "gpec_lar_resistive.h5"  # Output filename for the stability-stage results
local_stability_flag = true    # Perform local stability analysis (Mercier and ballooning) across the psi profile
vac_flag             = true    # Compute plasma, vacuum, and total energies for free-boundary modes

qlow        = 1.02             # Integration initiated at q determined by min(q0, qlow)
qhigh       = 3.6              # Integration terminated at q limit determined by min(qa, qhigh)
sing_start  = 0                # Start integration at the sing_start'th rational from the axis (psilow)
nn_low      = 1                # Smallest toroidal mode number to include
nn_high     = 1                # Largest toroidal mode number to include
delta_mlow  = 8                # Expands lower bound of Fourier harmonics
delta_mhigh = 8                # Expands upper bound of Fourier harmonics
mthvac      = 960              # Number of points used in splines over poloidal angle at plasma-vacuum interface

eulerlagrange_tolerance = 1e-12 # Relative tolerance for ODE integration of Euler-Lagrange equations
singfac_min             = 1e-4  # Fractional distance from rational q at which ideal jump enforced
ucrit                   = 1e4   # Maximum fraction of solutions allowed before re-normalized
sing_order              = 6     # Power-series order for the singular-surface asymptotics
save_interval           = 3     # Save every Nth ODE step (1=all, 10=every 10th). Always saves near rational surfaces.

use_parallel          = true   # Run parallel FM-propagator BVP path (unlocks singular/delta_prime_matrix)
parallel_threads      = 2      # BVP thread cap (1 = serial/bit-deterministic; 2 is about +20% speedup)
populate_dense_xi     = false  # Dense axis-basis xi for the FFS HDF5 output. Not needed here: the gal-matched path builds its own dense xi.
set_psilim_via_dmlim  = false  # Keep psilim at psihigh (do not truncate at last_rational_q + dmlim)
dmlim                 = 0.2    # Truncate integration at (last_rational_q + dmlim) / n (only used when set_psilim_via_dmlim = true)
force_termination     = true   # Terminate after the stability stage (no perturbed-equilibrium section here)
write_outputs_to_HDF5 = true   # Write stability outputs to HDF5

# Outer-region singular Galerkin Delta-prime solver with rpec coil columns.
gal_flag               = true  # Enable the outer-region singular Galerkin Delta-prime solve
gal_solver             = "LU"  # Banded solver: "LU" (zgbtrf/zgbtrs) or "cholesky" (zpbtrf/zpbtrs). rpec requires "LU".
gal_nx                 = 256   # Hermite-cubic elements per interval between singular surfaces
gal_nq                 = 6     # Gauss-Lobatto quadrature order per element
gal_pfac               = 0.03  # Grid packing ratio toward singular surfaces (smaller = tighter packing)
gal_dx0                = 5e-4  # Resonant-element integration truncation distance from the rational (times 1/|n q'|)
gal_dx1                = 1e-3  # Resonant-element size (times 1/|n q'|)
gal_dx2                = 1e-3  # Extension-element size (times 1/|n q'|)
gal_cutoff             = 10    # Number of elements carrying the large (driving) solution as a source term
gal_tol                = 1e-10 # Resonant-cell adaptive-quadrature (QuadGK) tolerance
gal_gnstep             = 5000  # Maximum resonant-integration steps
gal_dx1dx2_flag        = true  # Enable the special dx1/dx2 element sizing for resonant/extension cells
gal_sing_order         = 6     # Base power-series order for the Galerkin singular asymptotics
gal_sing_order_ceiling = true  # Auto-raise the series order by ceil(2*Re(alpha)) on high-Mercier-index surfaces
gal_rpec_flag          = true  # Append mpert coil-response columns (unit edge sources) to the solve, giving the delta_coil block

# DRIVEN (RPEC) outer-inner matching. Per-surface resistive inputs (core to edge) for the two
# rational surfaces q = 2 and q = 3: eta=8e-8, rho=3.3e-7 kg/m^3, rotation=1 Hz, Gamma=5/3.
gal_match_flag         = true  # Solve the coil-driven matched xi(psi) from the gal Delta-prime + the inner-layer Delta(Q). Requires gal_rpec_flag = true.
gal_ideal_flag         = false # true = build the IDEAL solution (skip the inner layer, bare coil columns). false = the resistive matching below.
gal_inner_solver       = "ray" # Inner-layer Delta backend: "ray" (rotated-contour collocation, robust at large |Q|) or "galerkin"
gal_eta                = [8e-8, 8e-8]      # Per-surface resistivity eta (core to edge)
gal_rho                = [3.3e-7, 3.3e-7]  # Per-surface mass density rho [kg/m^3] (core to edge)
gal_rotation           = [1.0, 1.0]        # Per-surface rotation frequency f [Hz] (core to edge); forced eigenvalue gamma_s = 2*pi*i*n*f
gal_gamma              = 1.6666666666666667 # Ratio of specific heats Gamma for the resistive-layer coefficients (5/3)
